<html lang="en">
<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: #0a0a0a;
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  color: #EBEBF5;
}
body { padding: 32px 24px 64px; }

.page-head {
  max-width: 1480px; margin: 0 auto 28px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
  border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 18px;
}
.page-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #fff; }
.page-head .meta { font-size: 12px; color: rgba(235,235,245,0.5); font-family: 'Geist Mono', 'SF Mono', monospace; }
.page-head .badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  background: rgba(139,92,246,0.18); color: #B794F6;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; margin-right: 8px;
}

.grid {
  max-width: 1480px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px 28px;
}
.cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.cell .caption {
  font-size: 12px; color: rgba(235,235,245,0.55); line-height: 1.55;
  text-align: center; max-width: 320px;
}
.cell .caption strong { color: #fff; font-weight: 600; display: block; margin-bottom: 4px; font-size: 13px; }
.cell .caption .tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  background: rgba(139,92,246,0.15); color: #B794F6;
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
  font-family: 'Geist Mono', monospace; margin-bottom: 6px;
}

.phone {
  width: 393px; height: 852px;
  background: #000;
  border-radius: 52px;
  box-shadow: 0 0 0 2px #2a2a2a, 0 24px 60px rgba(0,0,0,0.6), inset 0 0 0 1px #444;
  position: relative; overflow: hidden;
  font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  transform: scale(0.78); transform-origin: top center;
  margin-bottom: -180px;
}
.island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 30;
}
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; height: 54px;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 28px 10px; z-index: 20; pointer-events: none;
  font-size: 15px; font-weight: 600; color: #fff;
}

::-webkit-scrollbar { width: 0; height: 0; }

</head>
<body>

<div class="page-head">
  <div>
    <span class="badge">YT-0028 · STATES</span>
    <h1 style="display:inline-block;">Library &amp; Playlist — Static states</h1>
  </div>
  <div class="meta">YourTube · iOS 17+ · SwiftUI · #8B5CF6</div>
</div>

<div id="root"></div>

<script type="text/babel">
const C = {
  bg: '#000',
  surface: '#1C1C1E',
  surface2: '#2C2C2E',
  surface3: '#3A3A3C',
  fg1: '#FFFFFF',
  fg2: 'rgba(235,235,245,0.6)',
  fg3: 'rgba(235,235,245,0.4)',
  fg4: 'rgba(235,235,245,0.25)',
  hairline: 'rgba(255,255,255,0.08)',
  accent: '#8B5CF6',
  red: '#FF453A',
};

function hashHue(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) { h = (h * 31 + seed.charCodeAt(i)) & 0xFFFFFFFF; }
  return Math.abs(h) % 360;
}
function gradientFor(seed) {
  const h1 = hashHue(seed);
  const h2 = (h1 + 40) % 360;
  return `linear-gradient(135deg, oklch(0.45 0.12 ${h1}) 0%, oklch(0.30 0.12 ${h2}) 100%)`;
}

const ART = [
  'linear-gradient(135deg, #5B2A86 0%, #2B6CB0 100%)',
  'linear-gradient(135deg, #C05621 0%, #742A2A 100%)',
  'linear-gradient(135deg, #2D3748 0%, #1A202C 100%)',
  'linear-gradient(135deg, #38A169 0%, #1A4731 100%)',
  'linear-gradient(135deg, #D69E2E 0%, #744210 100%)',
  'linear-gradient(135deg, #4A5568 0%, #2D3748 100%)',
  'linear-gradient(135deg, #B83280 0%, #44337A 100%)',
  'linear-gradient(135deg, #319795 0%, #234E52 100%)',
];

const I = {
  plus: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  chev: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="9,6 15,12 9,18"/></svg>,
  chevBack: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="15,6 9,12 15,18"/></svg>,
  clock: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 15.5,14"/></svg>,
  ellipsis: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="7" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="17" cy="12" r="1.2" fill="currentColor"/></svg>,
  play: <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 21,12 6,21"/></svg>,
  shuffle: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21,16 21,21 16,21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>,
  musicNote: <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
  musicNoteList: <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="6" x2="13" y2="6"/><line x1="3" y1="12" x2="13" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/><circle cx="17" cy="17" r="3" fill="currentColor"/><path d="M20 17V7l-3 1"/></svg>,
  minus: <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11" fill="#FF453A"/><rect x="6" y="11" width="12" height="2" rx="1" fill="#fff"/></svg>,
  drag: <svg width="22" height="18" viewBox="0 0 24 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="4" x2="21" y2="4"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="14" x2="21" y2="14"/></svg>,
  check: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="5,12 10,17 19,7"/></svg>,
  plusCircle: <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11"/><line x1="12" y1="7" x2="12" y2="17" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"/><line x1="7" y1="12" x2="17" y2="12" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"/></svg>,
  trash: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>,
};

// ─── Phone shell pieces ────────────────────────────────────────────────
function StatusBar() {
  return (
    <>
      <div className="island"/>
      <div className="statusbar">
        <span>9:41</span>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <svg width="17" height="11" viewBox="0 0 17 11" fill="white"><rect x="0" y="3" width="3" height="8" rx="0.8" opacity="0.5"/><rect x="4.5" y="2" width="3" height="9" rx="0.8" opacity="0.7"/><rect x="9" y="0.5" width="3" height="10.5" rx="0.8"/><rect x="14" y="1" width="2.5" height="10" rx="0.8" opacity="0.4"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" strokeOpacity="0.4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6S23.8 4.8 23 4.5z" fill="white"/></svg>
        </div>
      </div>
    </>
  );
}
function MiniPlayer() {
  return (
    <div style={{position:'absolute', left:0, right:0, bottom: 49, background:'rgba(28,28,30,0.94)',
      backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)',
      borderTop:`1px solid ${C.hairline}`, padding:'8px 12px',
      display:'flex', alignItems:'center', gap: 12}}>
      <div style={{width: 44, height: 44, borderRadius: 6, background: ART[0]}}/>
      <div style={{flex:1, minWidth:0}}>
        <div style={{fontSize: 14, fontWeight: 600, color: C.fg1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>Chill Lofi Mix — Deep Focus</div>
        <div style={{fontSize: 12, color: C.fg2}}>ChillHop Music</div>
      </div>
      <button style={{width:36, height:36, border:'none', background:'transparent', color: C.fg1, display:'flex', alignItems:'center', justifyContent:'center'}}>{I.play}</button>
    </div>
  );
}
function TabBar({ active = 'library' }) {
  const tabs = [
    { id:'search', label:'Search', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg> },
    { id:'library', label:'Library', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="14" y2="18"/></svg> },
    { id:'settings', label:'Settings', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg> },
  ];
  return (
    <div style={{position:'absolute', left:0, right:0, bottom:0, height: 49, background:'rgba(28,28,30,0.94)',
      backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)',
      borderTop:`1px solid ${C.hairline}`, display:'flex', alignItems:'flex-start', paddingTop: 6}}>
      {tabs.map(t => (
        <div key={t.id} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap: 2,
          color: t.id === active ? C.accent : C.fg2}}>
          {t.icon}
          <div style={{fontSize: 10, fontWeight: 500}}>{t.label}</div>
        </div>
      ))}
    </div>
  );
}

function Phone({ children }) {
  return (
    <div className="phone">
      <StatusBar/>
      <div style={{position:'absolute', inset:0}}>{children}</div>
    </div>
  );
}

// ─── State 1: Empty Library ───────────────────────────────────────────
function EmptyLibrary() {
  return (
    <Phone>
      <div style={{position:'absolute', inset:0, background: C.bg, display:'flex', flexDirection:'column'}}>
        <div style={{paddingTop: 54, height: 96, display:'flex', alignItems:'flex-end', justifyContent:'flex-end',
          padding:'54px 16px 0'}}>
          <button aria-label="Create playlist" style={{
            width: 44, height: 44, border:'none', background:'transparent', color: C.accent,
            display:'flex', alignItems:'center', justifyContent:'center'}}>{I.plus}</button>
        </div>
        <div style={{padding:'4px 20px 10px'}}>
          <h1 style={{fontSize: 34, fontWeight: 700, letterSpacing:-0.4, color: C.fg1, lineHeight: 1.1}}>Library</h1>
        </div>
        {/* Recently played still present */}
        <div style={{height: 18}}/>
        <div style={{margin:'0 16px', background: C.surface, borderRadius: 12}}>
          <div style={{display:'flex', alignItems:'center', gap: 14, padding:'14px 16px'}}>
            <div style={{width: 32, height: 32, borderRadius: 8, background: C.surface2,
              display:'flex', alignItems:'center', justifyContent:'center', color: C.accent}}>{I.clock}</div>
            <div style={{flex:1, fontSize: 17, fontWeight: 500, color: C.fg1}}>Recently Played</div>
            <span style={{color: C.fg3}}>{I.chev}</span>
          </div>
        </div>

        {/* ContentUnavailableView */}
        <div style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
          padding:'0 32px 130px', textAlign:'center', gap: 16}}>
          <div style={{color: C.fg3}}>{I.musicNoteList}</div>
          <div style={{fontSize: 22, fontWeight: 700, color: C.fg1, letterSpacing:-0.2}}>No playlists yet</div>
          <div style={{fontSize: 15, color: C.fg2, lineHeight: 1.4, maxWidth: 280}}>
            Create one to organize tracks for offline listening.
          </div>
          <button style={{marginTop: 8, height: 50, padding:'0 24px', border:'none', borderRadius: 12,
            background: C.accent, color:'#fff', fontWeight: 600, fontSize: 16, fontFamily:'inherit',
            display:'flex', alignItems:'center', gap: 8, boxShadow:'0 4px 12px rgba(139,92,246,0.3)'}}>
            Create Playlist
          </button>
        </div>

        <MiniPlayer/>
        <TabBar/>
      </div>
    </Phone>
  );
}

// ─── State 2: PlaylistDetail in Edit mode ────────────────────────────
function EditModeDetail() {
  const tracks = [
    { i:0, title:'Sunset Avenue',     channel:'Lofi Girl',       duration:'3:42' },
    { i:1, title:'Quiet Mornings',    channel:'ChillHop Music',  duration:'4:15' },
    { i:2, title:'Coffee & Rain',     channel:'Lofi Girl',       duration:'3:58' },
    { i:3, title:'Tokyo Drift Slow',  channel:'Nujabes Tribute', duration:'5:21' },
    { i:4, title:'Late Train Home',   channel:'ChillHop Music',  duration:'3:09' },
    { i:5, title:'Vinyl Crackle',     channel:'Soulection',      duration:'4:48' },
  ];
  const playlist = { id:'pl-001', name:'Deep Focus', tracks:[0,1,2,3,4,5] };
  return (
    <Phone>
      <div style={{position:'absolute', inset:0, background: C.bg, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {/* Nav (collapsed look — edit mode usually scrolled) */}
        <div style={{paddingTop: 54, height: 56, display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'54px 8px 0', position:'relative'}}>
          <button aria-label="Back" style={{
            width: 44, height: 44, border:'none', background:'transparent', color: C.accent,
            display:'flex', alignItems:'center', justifyContent:'center'}}>{I.chevBack}</button>
          <div style={{flex:1, textAlign:'center', fontSize: 17, fontWeight: 600, color: C.fg1}}>Deep Focus</div>
          <button style={{
            height: 44, padding:'0 12px', border:'none', background:'transparent',
            color: C.accent, fontSize: 17, fontWeight: 600, fontFamily:'inherit'}}>Done</button>
        </div>

        <div style={{flex:1, overflowY:'auto', paddingBottom: 130, marginTop: 12}}>
          {tracks.map((t, i) => (
            <div key={i} style={{display:'flex', alignItems:'center', gap: 12, padding:'10px 12px',
              borderBottom: i === tracks.length - 1 ? 'none' : `0.5px solid ${C.hairline}`}}>
              {/* Native red minus glyph */}
              <div style={{width: 28, display:'flex', justifyContent:'center'}}>{I.minus}</div>
              {/* Track row */}
              <div style={{width: 44, height: 44, borderRadius: 6, background: ART[t.i % ART.length], flexShrink: 0}}/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize: 16, fontWeight: 500, color: C.fg1, lineHeight: 1.25,
                  whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{t.title}</div>
                <div style={{fontSize: 13, color: C.fg2, marginTop: 2,
                  whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>
                  {t.channel} · {t.duration}
                </div>
              </div>
              {/* Native trailing drag handle */}
              <div style={{width: 30, display:'flex', justifyContent:'center', color: C.fg3}}>{I.drag}</div>
            </div>
          ))}
        </div>

        <MiniPlayer/>
        <TabBar/>
      </div>
    </Phone>
  );
}

// ─── State 3: Add to Playlist sheet ──────────────────────────────────
function AddToPlaylistSheet() {
  const playlists = [
    { id:'pl-001', name:'Deep Focus',       count: 12, tracks:[0,1,2,3] },
    { id:'pl-002', name:'Sunday Morning',   count:  7, tracks:[2,4,5,7] },
    { id:'pl-003', name:'Late Drives',      count:  2, tracks:[6,7] },
    { id:'pl-004', name:'Workout Mix',      count:  8, tracks:[0,1,2,3] },
    { id:'pl-005', name:'Live Shows 2024',  count:  1, tracks:[5] },
  ];
  const selected = new Set(['pl-001', 'pl-004']);

  // Background context: a track detail / search result page (dimmed)
  return (
    <Phone>
      {/* Behind sheet */}
      <div style={{position:'absolute', inset:0, background: C.bg, opacity: 0.4}}>
        <div style={{paddingTop: 54, height: 56, padding:'54px 8px 0', display:'flex'}}>
          <div style={{width: 44, height: 44, color: C.accent, display:'flex', alignItems:'center', justifyContent:'center'}}>{I.chevBack}</div>
        </div>
        <div style={{padding:'24px 20px'}}>
          <div style={{width: 200, height: 200, borderRadius: 12, background: ART[0], margin:'0 auto'}}/>

          <div style={{textAlign:'center', fontSize: 14, color: C.fg2}}>Lofi Girl</div>
        </div>
      </div>

      {/* Dimming layer */}
      <div style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.4)'}}/>

      {/* Sheet */}

        display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {/* Drag indicator */}
        <div style={{display:'flex', justifyContent:'center', paddingTop: 6}}>
          <div style={{width: 36, height: 5, borderRadius: 3, background:'rgba(255,255,255,0.25)'}}/>
        </div>
        {/* Toolbar */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'8px 16px', borderBottom: `0.5px solid ${C.hairline}`}}>
          <button style={{border:'none', background:'transparent', color: C.accent, fontSize: 17, fontWeight: 400, fontFamily:'inherit'}}>Cancel</button>
          <div style={{fontSize: 17, fontWeight: 600, color: C.fg1}}>Add to playlist</div>
          <button style={{border:'none', background:'transparent', color: C.accent, fontSize: 17, fontWeight: 600, fontFamily:'inherit'}}>Done</button>
        </div>

        {/* Body */}
        <div style={{flex:1, overflowY:'auto'}}>
          {/* New playlist row */}
          <div style={{padding:'14px 16px', display:'flex', alignItems:'center', gap: 14,
            borderBottom: `0.5px solid ${C.hairline}`}}>
            <div style={{color: C.accent}}>{I.plusCircle}</div>
            <div style={{flex:1, fontSize: 17, fontWeight: 500, color: C.accent}}>New Playlist</div>
          </div>

          {/* Playlists section */}
          <div style={{padding:'18px 20px 6px', fontSize: 13, color: C.fg2, textTransform:'uppercase', letterSpacing: 0.4}}>
            Playlists
          </div>
          {playlists.map((pl, i) => (
            <div key={pl.id} style={{display:'flex', alignItems:'center', gap: 14, padding:'10px 16px',
              borderBottom: i === playlists.length - 1 ? 'none' : `0.5px solid ${C.hairline}`}}>
              {/* small cover */}
              <div style={{width: 40, height: 40, borderRadius: 6, overflow:'hidden',
                display:'grid', gridTemplateColumns:'1fr 1fr', gridTemplateRows:'1fr 1fr', gap: 1, background:'#000'}}>
                {pl.tracks.slice(0, 4).map((t, j) => (
                  <div key={j} style={{background: ART[t % ART.length]}}/>
                ))}
              </div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize: 16, fontWeight: 500, color: C.fg1}}>{pl.name}</div>
                <div style={{fontSize: 13, color: C.fg2, marginTop: 1}}>{pl.count} {pl.count === 1 ? 'track' : 'tracks'}</div>
              </div>
              {selected.has(pl.id) && (
                <span style={{color: C.accent}}>{I.check}</span>
              )}
            </div>
          ))}
        </div>
      </div>
    </Phone>
  );
}

// ─── State 6: Swipe action — destructive Remove peek ─────────────────
function SwipeRemove() {
  const tracks = [
    { i:0, title:'Sunset Avenue',     channel:'Lofi Girl',       duration:'3:42', swiped: false },
    { i:1, title:'Quiet Mornings',    channel:'ChillHop Music',  duration:'4:15', swiped: true  },
    { i:2, title:'Coffee & Rain',     channel:'Lofi Girl',       duration:'3:58', swiped: false },
    { i:3, title:'Tokyo Drift Slow',  channel:'Nujabes Tribute', duration:'5:21', swiped: false },
    { i:4, title:'Late Train Home',   channel:'ChillHop Music',  duration:'3:09', swiped: false },
  ];
  return (
    <Phone>
      <div style={{position:'absolute', inset:0, background: C.bg, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        <div style={{paddingTop: 54, height: 56, padding:'54px 8px 0', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <button style={{width: 44, height: 44, border:'none', background:'transparent', color: C.accent, display:'flex', alignItems:'center', justifyContent:'center'}}>{I.chevBack}</button>
          <div style={{flex:1, textAlign:'center', fontSize: 17, fontWeight: 600, color: C.fg1}}>Deep Focus</div>
          <button style={{width: 44, height: 44, border:'none', background:'transparent', color: C.accent, display:'flex', alignItems:'center', justifyContent:'center'}}>{I.ellipsis}</button>
        </div>

        <div style={{flex:1, overflowY:'hidden', paddingBottom: 130, marginTop: 8}}>
          {tracks.map((t, i) => (
            <div key={i} style={{position:'relative', height: 64,
              borderBottom: i === tracks.length - 1 ? 'none' : `0.5px solid ${C.hairline}`,
              overflow:'hidden'}}>
              {/* Trailing destructive action */}
              {t.swiped && (
                <div style={{position:'absolute', top:0, right:0, bottom:0, width: 80,
                  background: C.red, display:'flex', alignItems:'center', justifyContent:'center',
                  color:'#fff', flexDirection:'column', gap: 2}}>
                  {I.trash}
                  <span style={{fontSize: 13, fontWeight: 500}}>Remove</span>
                </div>
              )}
              {/* Row */}
              <div style={{display:'flex', alignItems:'center', gap: 12, padding:'10px 16px',
                background: C.bg, position:'absolute', top:0, bottom:0, left:0, right: 0,
                transform: t.swiped ? 'translateX(-80px)' : 'translateX(0)',
                transition:'transform 200ms ease'}}>
                <div style={{width: 44, height: 44, borderRadius: 6, background: ART[t.i % ART.length], flexShrink: 0}}/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize: 16, fontWeight: 500, color: C.fg1, lineHeight: 1.25,
                    whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{t.title}</div>
                  <div style={{fontSize: 13, color: C.fg2, marginTop: 2}}>{t.channel} · {t.duration}</div>
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Undo snackbar above MiniPlayer */}
        <div style={{position:'absolute', left: 16, right: 16, bottom: 49 + 60 + 12,
          background:'rgba(54,54,56,0.92)', backdropFilter:'blur(30px)', WebkitBackdropFilter:'blur(30px)',
          borderRadius: 12, padding:'12px 16px', display:'flex', alignItems:'center', gap: 12,
          boxShadow:'0 10px 30px rgba(0,0,0,0.5)'}}>
          <div style={{flex:1, fontSize: 14, color: C.fg1}}>Removed Quiet Mornings</div>
          <button style={{border:'none', background:'transparent', color: C.accent,
            fontSize: 15, fontWeight: 600, fontFamily:'inherit'}}>Undo</button>
        </div>

        <MiniPlayer/>
        <TabBar/>
      </div>
    </Phone>
  );
}
