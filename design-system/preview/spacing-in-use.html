<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background: var(--color-bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--font-mono); font-size: 10px; color: var(--color-fg-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }

/* Skeleton */
.skeleton { background: var(--color-surface-variant); border-radius: 4px; position: relative; overflow: hidden; }
.skeleton::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
  animation: shimmer 1.5s ease-in-out infinite;
  background-size: 200% 100%;
}
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.track-skel { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--color-surface); border-radius: 12px; }
.track-skel + .track-skel { border-radius: 0; margin-top: -1px; border-top: 1px solid var(--color-border); }
.track-skel:last-child { border-radius: 0 0 12px 12px; }

/* Motion tokens */
.motion-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--color-border); }
.motion-row:last-child { border-bottom: none; }
.motion-name { font-family: var(--font-mono); font-size: 11px; color: var(--color-accent); width: 120px; flex-shrink: 0; }
.motion-val { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-tertiary); }
.motion-demo { width: 32px; height: 32px; background: var(--color-accent-subtle); border-radius: 8px; border: 1.5px solid var(--color-accent); cursor: pointer; }
.motion-demo:hover { animation: pop var(--dur, 200ms) var(--ease, ease) forwards; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(0.92); } 100% { transform: scale(1); } }
</style>
</head>
<body>
  <div>
    <div class="label">Skeleton loading rows</div>
    <div>
      <div class="track-skel">
        <div class="skeleton" style="width:56px;height:56px;border-radius:8px;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
          <div class="skeleton" style="height:14px;width:60%;"></div>
          <div class="skeleton" style="height:12px;width:35%;"></div>
        </div>
      </div>
      <div class="track-skel">
        <div class="skeleton" style="width:56px;height:56px;border-radius:8px;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
          <div class="skeleton" style="height:14px;width:75%;"></div>
          <div class="skeleton" style="height:12px;width:40%;"></div>
        </div>
      </div>
      <div class="track-skel">
        <div class="skeleton" style="width:56px;height:56px;border-radius:8px;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
          <div class="skeleton" style="height:14px;width:50%;"></div>
          <div class="skeleton" style="height:12px;width:30%;"></div>
        </div>
      </div>
    </div>
  </div>

  <div>
    <div class="label">Motion tokens</div>
    <div class="motion-row"><span class="motion-name">--transition-fast</span><span class="motion-val">150ms ease</span><div class="motion-demo" style="--dur:150ms;--ease:ease;"></div></div>
    <div class="motion-row"><span class="motion-name">--transition-std</span><span class="motion-val">200ms ease</span><div class="motion-demo" style="--dur:200ms;--ease:ease;"></div></div>
    <div class="motion-row"><span class="motion-name">--transition-slow</span><span class="motion-val">300ms ease</span><div class="motion-demo" style="--dur:300ms;--ease:ease;"></div></div>
  </div>
</body>
</html>
