<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background: var(--color-bg); padding: 20px; }
.row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--color-border); }
.row:last-child { border-bottom: none; }
.meta { width: 140px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
.role { font-size: 11px; font-weight: 600; font-family: var(--font-mono); color: var(--color-accent); }
.specs { font-size: 10px; font-family: var(--font-mono); color: var(--color-fg-tertiary); }
.sample { flex: 1; color: var(--color-fg-primary); font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="row">
    <div class="meta"><span class="role">displayLarge</span><span class="specs">32px / 600 / -0.02em</span></div>
    <div class="sample" style="font-size:32px;font-weight:600;letter-spacing:-0.02em;line-height:1.2">Now Playing</div>
  </div>
  <div class="row">
    <div class="meta"><span class="role">titleLarge</span><span class="specs">20px / 600 / -0.02em</span></div>
    <div class="sample" style="font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1.35">My Playlists</div>
  </div>
  <div class="row">
    <div class="meta"><span class="role">titleMedium</span><span class="specs">18px / 600 / -0.02em</span></div>
    <div class="sample" style="font-size:18px;font-weight:600;letter-spacing:-0.02em;line-height:1.35">Search</div>
  </div>
  <div class="row">
    <div class="meta"><span class="role">bodyLarge</span><span class="specs">16px / 400 / 0em</span></div>
    <div class="sample" style="font-size:16px;font-weight:400;line-height:1.5">Bohemian Rhapsody — Queen</div>
  </div>
  <div class="row">
    <div class="meta"><span class="role">bodyMedium</span><span class="specs">14px / 400 / 0em</span></div>
    <div class="sample" style="font-size:14px;font-weight:400;line-height:1.5;color:rgba(235,235,245,0.8)">Queen · 5:55</div>
  </div>
  <div class="row">
    <div class="meta"><span class="role">labelSmall</span><span class="specs">12px / 500 / +0.04em</span></div>
    <div class="sample" style="font-size:12px;font-weight:500;letter-spacing:0.04em;line-height:1.2;color:rgba(235,235,245,0.4)">5:55 · DURATION</div>
  </div>
</body>
</html>
