<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background: #F2F2F7; padding: 20px; }
.grid { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { border-radius: 8px; overflow: hidden; width: 100px; border: 1px solid #D1D1D6; }
.swatch-color { height: 56px; }
.swatch-label { padding: 6px 8px; background: #FFFFFF; }
.swatch-name { font-size: 11px; font-weight: 500; color: #000; font-family: var(--font-sans); }
.swatch-val { font-size: 10px; color: rgba(60,60,67,0.5); font-family: 'SF Mono', monospace; margin-top: 2px; }
.section-title { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(60,60,67,0.4); margin: 16px 0 8px; }
</style>
</head>
<body>
<div class="section-title">Accent (light)</div>
<div class="grid">
  <div class="swatch"><div class="swatch-color" style="background:#7C3AED"></div><div class="swatch-label"><div class="swatch-name">accent</div><div class="swatch-val">#7C3AED</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#6D28D9"></div><div class="swatch-label"><div class="swatch-name">accent-dim</div><div class="swatch-val">#6D28D9</div></div></div>
</div>
<div class="section-title">Surfaces (light)</div>
<div class="grid">
  <div class="swatch"><div class="swatch-color" style="background:#F2F2F7"></div><div class="swatch-label"><div class="swatch-name">bg</div><div class="swatch-val">#F2F2F7</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#FFFFFF"></div><div class="swatch-label"><div class="swatch-name">surface</div><div class="swatch-val">#FFFFFF</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#F2F2F7"></div><div class="swatch-label"><div class="swatch-name">surface-var</div><div class="swatch-val">#F2F2F7</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#E5E5EA"></div><div class="swatch-label"><div class="swatch-name">surface-high</div><div class="swatch-val">#E5E5EA</div></div></div>
</div>
<div class="section-title">Foreground (light)</div>
<div class="grid">
  <div class="swatch"><div class="swatch-color" style="background:#000000"></div><div class="swatch-label"><div class="swatch-name">fg-primary</div><div class="swatch-val">#000000</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:rgba(60,60,67,0.60)"></div><div class="swatch-label"><div class="swatch-name">fg-secondary</div><div class="swatch-val">60% black</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:rgba(60,60,67,0.30)"></div><div class="swatch-label"><div class="swatch-name">fg-tertiary</div><div class="swatch-val">30% black</div></div></div>
</div>
</body>
</html>
