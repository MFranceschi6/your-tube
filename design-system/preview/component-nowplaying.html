<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { background: var(--color-bg); padding: 16px; }
.label { font-family: var(--font-mono); font-size: 10px; color: var(--color-fg-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.gap { height: 20px; }

/* Now Playing compact preview */
.nowplaying {
  background: linear-gradient(160deg, #2C1B4E 0%, #0F0F0F 60%);
  border-radius: 16px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px;
}
.np-artwork {
  width: 100%; aspect-ratio: 1; border-radius: 12px;
  background: linear-gradient(135deg, #3D1F7A, #1F3A7A);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  max-height: 140px;
}
.np-meta { display: flex; flex-direction: column; gap: 3px; }
.np-title { font-size: 20px; font-weight: 600; color: var(--color-fg-primary); font-family: var(--font-sans); letter-spacing: -0.02em; }
.np-channel { font-size: 14px; color: var(--color-fg-secondary); font-family: var(--font-sans); }
.np-scrubber { display: flex; flex-direction: column; gap: 6px; }
.scrubber-track { height: 4px; background: var(--color-scrubber-track); border-radius: 2px; position: relative; cursor: pointer; }
.scrubber-fill { height: 100%; background: var(--color-accent); border-radius: 2px; width: 38%; position: relative; }
.scrubber-fill::after { content:''; position: absolute; right: -6px; top: -6px; width: 14px; height: 14px; background: white; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.scrubber-times { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--font-sans); color: var(--color-fg-tertiary); font-variant-numeric: tabular-nums; }
.np-controls { display: flex; align-items: center; justify-content: space-between; }
.ctrl-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: transparent; border: none; cursor: pointer; color: var(--color-fg-secondary); transition: background var(--transition-fast); }
.ctrl-btn:hover { background: rgba(255,255,255,0.08); }
.ctrl-btn.main { width: 56px; height: 56px; background: var(--color-accent); color: white; box-shadow: 0 4px 16px rgba(139,92,246,0.4); }
.ctrl-btn.main:hover { background: var(--color-accent-dim); }
.ctrl-btn svg { width: 22px; height: 22px; }
.ctrl-btn.main svg { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="label">NowPlaying Screen (compact)</div>
<div class="nowplaying">
  <div class="np-artwork">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </div>
  <div class="np-meta">
    <div class="np-title">Bohemian Rhapsody</div>
    <div class="np-channel">Queen</div>
  </div>
  <div class="np-scrubber">
    <div class="scrubber-track"><div class="scrubber-fill"></div></div>
    <div class="scrubber-times"><span>2:15</span><span>5:55</span></div>
  </div>
  <div class="np-controls">
    <button class="ctrl-btn" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21,16 21,21 16,21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="ctrl-btn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19,20 9,12 19,4"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
    <button class="ctrl-btn main" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button class="ctrl-btn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
    <button class="ctrl-btn" aria-label="Queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>
</div>
</body>
</html>
