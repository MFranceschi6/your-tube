<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT-0028/29 — iOS Library, Playlist Detail, History</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; }
.phone { width: 393px; height: 852px; background: #000; border-radius: 52px; box-shadow: 0 0 0 2px #3a3a3a, 0 40px 100px rgba(0,0,0,0.9), inset 0 0 0 1px #555; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.task-badge { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(139,92,246,0.95); color: white; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 999px; z-index: 1000; letter-spacing: 0.03em; pointer-events: none; box-shadow: 0 2px 8px rgba(139,92,246,0.5); }
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div class="task-badge">YT-0028 · YT-0029 — iOS Library, Playlist Detail, History</div>
<div class="phone" id="root"></div>
<script type="text/babel">

const C = { bg:'#000',bg2:'#1C1C1E',bg3:'#2C2C2E',bg4:'#3A3A3C',fg1:'#FFFFFF',fg2:'rgba(235,235,245,0.6)',fg3:'rgba(235,235,245,0.3)',accent:'#8B5CF6',accentTint:'rgba(139,92,246,0.15)',error:'#FF453A',sep:'rgba(84,84,88,0.65)' };
const F = "-apple-system,'SF Pro Text',BlinkMacSystemFont,sans-serif";
const FD = "-apple-system,'SF Pro Display',BlinkMacSystemFont,sans-serif";
const fmt = s => { if(!s) return 'Live'; const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; };

const PLAYLISTS = [
  { id:'p1', name:'Lofi Chill', trackCount:24, colors:['#3D1F7A','#1F3A7A','#1F6A4A','#6A3A1F'] },
  { id:'p2', name:'Rock Classics', trackCount:18, colors:['#7A1F1F','#4A3A1F','#1F4A3A','#3A1F7A'] },
  { id:'p3', name:'Focus Mode', trackCount:12, colors:['#1F4A6A','#3A4A1F','#1F1F7A','#6A4A1F'] },
  { id:'p4', name:'Morning Energy', trackCount:9, colors:['#6A1F3A','#1F6A3A','#3A6A1F','#1F3A6A'] },
];
const PLAYLIST_TRACKS = [
  { videoId:'t1', title:'Bohemian Rhapsody', channel:'Queen', durationSec:355 },
  { videoId:'t2', title:'Hotel California', channel:'Eagles', durationSec:438 },
  { videoId:'t3', title:'Stairway to Heaven', channel:'Led Zeppelin', durationSec:482 },
  { videoId:'t4', title:'Comfortably Numb', channel:'Pink Floyd', durationSec:382 },
  { videoId:'t5', title:"November Rain", channel:"Guns N' Roses", durationSec:537 },
  { videoId:'t6', title:'Sweet Child O\' Mine', channel:"Guns N' Roses", durationSec:356 },
];
const HISTORY = [
  { videoId:'h1', title:'Stairway to Heaven', channel:'Led Zeppelin', durationSec:482, playedAt:'Today, 10:32' },
  { videoId:'h2', title:'Hotel California (Live)', channel:'Eagles', durationSec:438, playedAt:'Today, 09:14' },
  { videoId:'h3', title:'Bohemian Rhapsody', channel:'Queen', durationSec:355, playedAt:'Yesterday' },
  { videoId:'h4', title:'Comfortably Numb', channel:'Pink Floyd', durationSec:382, playedAt:'Yesterday' },
  { videoId:'h5', title:'Lo-Fi Beats Vol. 3', channel:'Lofi Records', durationSec:5400, playedAt:'2 days ago' },
];

// Status bar
const StatusBar = () => (
  <div style={{ height:54, flexShrink:0, display:'flex', alignItems:'flex-end', justifyContent:'space-between', padding:'0 28px 10px', position:'relative', zIndex:20 }}>
    <div style={{ position:'absolute', top:10, left:'50%', transform:'translateX(-50%)', width:126, height:36, background:'#000', borderRadius:20 }} />
    <span style={{ fontFamily:FD, fontSize:15, fontWeight:600, color:C.fg1 }}>9:41</span>
    <div style={{ display:'flex', alignItems:'center', gap:6, color:C.fg1 }}>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="3" width="3" height="9" rx="1" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" opacity="0.6"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" strokeOpacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/></svg>
    </div>
  </div>
);

// Cover art (4-up grid)
const Cover = ({ colors, size=52 }) => (
  <div style={{ width:size, height:size, borderRadius:size*0.15, overflow:'hidden', flexShrink:0, display:'grid', gridTemplateColumns:'1fr 1fr', gap:2, background:C.bg3 }}>
    {colors.map((c,i) => <div key={i} style={{ background:c }} />)}
  </div>
);

// Row chevron
const Chev = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.fg3} strokeWidth="2.5" strokeLinecap="round"><polyline points="9,18 15,12 9,6"/></svg>;

// Tab bar stub
const TabBar = ({ active, onChange }) => {
  const tabs = [
    { id:'library', label:'Library', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg> },
    { id:'search', label:'Search', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> },
    { id:'settings', label:'Settings', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> },
  ];
  return (
    <div style={{ height:83, flexShrink:0, background:'rgba(28,28,30,0.95)', backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)', borderTop:`0.5px solid ${C.sep}`, display:'flex', alignItems:'flex-start', paddingTop:8, zIndex:10 }}>
      {tabs.map(t => { const on=active===t.id; return (
        <button key={t.id} onClick={()=>onChange(t.id)} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3, background:'transparent', border:'none', cursor:'pointer', color:on?C.accent:C.fg3, transition:'color 150ms' }}>
          {t.icon}<span style={{ fontFamily:F, fontSize:10, fontWeight:on?600:400 }}>{t.label}</span>
        </button>
      );})}
    </div>
  );
};

// ─── Library screen ───────────────────────────────────────────────────────────
const LibraryScreen = ({ onOpenPlaylist, onOpenHistory }) => {
  const [showNewSheet, setShowNewSheet] = React.useState(false);
  const [newName, setNewName] = React.useState('');

  return (
    <div style={{ flex:1, overflowY:'auto', background:C.bg }}>
      {/* Large title header */}
      <div style={{ padding:'8px 16px 0', display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:12 }}>
        <div style={{ fontFamily:FD, fontSize:28, fontWeight:700, color:C.fg1, letterSpacing:-0.5 }}>Library</div>
        <button onClick={()=>setShowNewSheet(true)} style={{ width:32, height:32, background:'none', border:'none', cursor:'pointer', color:C.accent, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      {/* Inset grouped list */}
      <div style={{ margin:'0 0 8px' }}>
        {/* Recently Played entry */}
        <div style={{ background:C.bg2, borderRadius:0, borderTop:`0.5px solid ${C.sep}`, borderBottom:`0.5px solid ${C.sep}` }}>
          <div onClick={onOpenHistory} style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 16px', cursor:'pointer' }}>
            <div style={{ width:52, height:52, borderRadius:10, background:C.accentTint, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontFamily:F, fontSize:16, fontWeight:500, color:C.fg1 }}>Recently Played</div>
              <div style={{ fontFamily:F, fontSize:13, color:C.fg2, marginTop:2 }}>{HISTORY.length} tracks</div>
            </div>
            <Chev />
          </div>
        </div>
      </div>

      {/* Section header */}
      <div style={{ padding:'16px 16px 6px', display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
        <span style={{ fontFamily:FD, fontSize:20, fontWeight:700, color:C.fg1, letterSpacing:-0.3 }}>Playlists</span>
        <span style={{ fontFamily:F, fontSize:13, color:C.fg2 }}>{PLAYLISTS.length} playlists</span>
      </div>

      {/* Playlists */}
      <div style={{ background:C.bg2, borderRadius:0, borderTop:`0.5px solid ${C.sep}`, borderBottom:`0.5px solid ${C.sep}` }}>
        {PLAYLISTS.map((pl, i) => (
          <div key={pl.id} onClick={() => onOpenPlaylist(pl)} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', cursor:'pointer', borderTop: i>0?`0.5px solid ${C.sep}`:'none' }}>
            <Cover colors={pl.colors} />
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontFamily:F, fontSize:16, fontWeight:500, color:C.fg1 }}>{pl.name}</div>
              <div style={{ fontFamily:F, fontSize:13, color:C.fg2, marginTop:2 }}>{pl.trackCount} tracks</div>
            </div>
            <Chev />
          </div>
        ))}
      </div>

      {/* Import/Export */}
      <div style={{ padding:'20px 16px 8px' }}>
        <div style={{ fontFamily:F, fontSize:13, fontWeight:600, color:C.fg3, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:8 }}>Playlists</div>
        <div style={{ background:C.bg2, borderRadius:12, overflow:'hidden', border:`0.5px solid ${C.sep}` }}>
          {[
            { label:'Import playlist', icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> },
            { label:'Export all', icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> },
          ].map((item, i) => (
            <div key={item.label} style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderTop:i>0?`0.5px solid ${C.sep}`:'none', cursor:'pointer' }}>
              <span style={{ color:C.accent }}>{item.icon}</span>
              <span style={{ fontFamily:F, fontSize:16, color:C.accent }}>{item.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* New Playlist Sheet */}
      {showNewSheet && (
        <div style={{ position:'absolute', inset:0, zIndex:50, display:'flex', flexDirection:'column' }}>
          <div style={{ flex:1, background:'rgba(0,0,0,0.5)' }} onClick={() => setShowNewSheet(false)} />
          <div style={{ background:C.bg2, borderRadius:'20px 20px 0 0', padding:'20px 16px 40px' }}>
            <div style={{ width:36, height:4, background:C.bg4, borderRadius:2, margin:'0 auto 16px' }} />
            <div style={{ fontFamily:FD, fontSize:17, fontWeight:600, color:C.fg1, textAlign:'center', marginBottom:16 }}>New Playlist</div>
            <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Playlist name" style={{ width:'100%', padding:'12px 14px', background:C.bg3, border:`1.5px solid ${newName?C.accent:C.bg4}`, borderRadius:10, fontFamily:F, fontSize:16, color:C.fg1, outline:'none', marginBottom:16 }} />
            <button onClick={()=>setShowNewSheet(false)} style={{ width:'100%', height:50, background:C.accent, border:'none', borderRadius:12, fontFamily:F, fontSize:16, fontWeight:600, color:'white', cursor:'pointer' }}>Create</button>
            <button onClick={()=>setShowNewSheet(false)} style={{ width:'100%', height:44, background:'transparent', border:'none', fontFamily:F, fontSize:16, color:C.fg2, cursor:'pointer', marginTop:4 }}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Playlist Detail screen ───────────────────────────────────────────────────
const PlaylistDetailScreen = ({ playlist, onBack, currentTrack, onPlay }) => {
  const [editMode, setEditMode] = React.useState(false);
  const [tracks, setTracks] = React.useState(PLAYLIST_TRACKS);
  const [showRenameSheet, setShowRenameSheet] = React.useState(false);
  const [name, setName] = React.useState(playlist.name);

  const removeTrack = (videoId) => setTracks(ts => ts.filter(t => t.videoId !== videoId));

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden' }}>
      {/* Nav bar */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 8px 4px', flexShrink:0 }}>
        <button onClick={onBack} style={{ width:44, height:44, background:'none', border:'none', cursor:'pointer', color:C.accent, display:'flex', alignItems:'center', justifyContent:'center', gap:4, fontFamily:F, fontSize:16 }}>
          <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="9,1 1,9 9,17"/></svg>
          Library
        </button>
        <button onClick={() => setEditMode(e => !e)} style={{ fontFamily:F, fontSize:16, color:C.accent, background:'none', border:'none', cursor:'pointer', fontWeight:editMode?600:400 }}>{editMode ? 'Done' : 'Edit'}</button>
      </div>

      <div style={{ flex:1, overflowY:'auto' }}>
        {/* Header area */}
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'8px 16px 20px', gap:12 }}>
          <Cover colors={playlist.colors} size={140} />
          <div style={{ textAlign:'center' }}>
            <div style={{ fontFamily:FD, fontSize:22, fontWeight:700, color:C.fg1, letterSpacing:-0.5 }}>{name}</div>
            <div style={{ fontFamily:F, fontSize:14, color:C.fg2, marginTop:2 }}>{tracks.length} tracks</div>
          </div>
          <div style={{ display:'flex', gap:12 }}>
            <button onClick={() => onPlay(tracks[0])} style={{ display:'flex', alignItems:'center', gap:6, padding:'10px 24px', background:C.accent, border:'none', borderRadius:999, fontFamily:F, fontSize:15, fontWeight:600, color:'white', cursor:'pointer' }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              Play
            </button>
            <button style={{ display:'flex', alignItems:'center', gap:6, padding:'10px 20px', background:C.bg3, border:'none', borderRadius:999, fontFamily:F, fontSize:15, fontWeight:500, color:C.fg1, cursor:'pointer' }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/></svg>
              Shuffle
            </button>
            <button onClick={() => setShowRenameSheet(true)} style={{ width:40, height:40, background:C.bg3, border:'none', borderRadius:20, cursor:'pointer', color:C.fg2, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
          </div>
        </div>

        {/* Track list */}
        <div style={{ borderTop:`0.5px solid ${C.sep}` }}>
          {tracks.map((t, i) => (
            <div key={t.videoId} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 16px', borderBottom:`0.5px solid ${C.sep}`, background:C.bg }}>
              {editMode && (
                <button onClick={() => removeTrack(t.videoId)} style={{ width:22, height:22, borderRadius:11, background:C.error, border:'none', cursor:'pointer', color:'white', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
              )}
              <div style={{ width:44, height:44, borderRadius:7, background:currentTrack?.videoId===t.videoId?C.accentTint:C.bg3, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }} onClick={() => onPlay(t)}>
                {currentTrack?.videoId===t.videoId
                  ? <svg width="14" height="14" viewBox="0 0 24 24" fill={C.accent}><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
                  : <svg width="14" height="14" viewBox="0 0 24 24" fill={C.fg3}><polygon points="5,3 19,12 5,21"/></svg>
                }
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:F, fontSize:15, fontWeight:currentTrack?.videoId===t.videoId?600:400, color:currentTrack?.videoId===t.videoId?C.accent:C.fg1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{t.title}</div>
                <div style={{ fontFamily:F, fontSize:13, color:C.fg2, marginTop:2, display:'flex', gap:4 }}>
                  <span>{t.channel}</span><span style={{ opacity:0.4 }}>·</span><span style={{ fontVariantNumeric:'tabular-nums' }}>{fmt(t.durationSec)}</span>
                </div>
              </div>
              {editMode
                ? <div style={{ color:C.fg3, cursor:'grab', display:'flex', alignItems:'center' }}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>
                  </div>
                : <button style={{ background:'none', border:'none', cursor:'pointer', color:C.fg3, display:'flex' }} onClick={e=>e.stopPropagation()}>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
                  </button>
              }
            </div>
          ))}
        </div>

        {/* Delete playlist */}
        <div style={{ padding:'20px 16px 32px' }}>
          <button style={{ width:'100%', padding:'14px', background:'rgba(255,69,58,0.1)', border:`0.5px solid rgba(255,69,58,0.3)`, borderRadius:12, fontFamily:F, fontSize:16, color:C.error, cursor:'pointer' }}>Delete Playlist</button>
        </div>
      </div>

      {/* Rename sheet */}
      {showRenameSheet && (
        <div style={{ position:'absolute', inset:0, zIndex:50, display:'flex', flexDirection:'column' }}>
          <div style={{ flex:1, background:'rgba(0,0,0,0.5)' }} onClick={() => setShowRenameSheet(false)} />
          <div style={{ background:C.bg2, borderRadius:'20px 20px 0 0', padding:'20px 16px 40px' }}>
            <div style={{ width:36, height:4, background:C.bg4, borderRadius:2, margin:'0 auto 16px' }} />
            <div style={{ fontFamily:FD, fontSize:17, fontWeight:600, color:C.fg1, textAlign:'center', marginBottom:16 }}>Rename Playlist</div>
            <input value={name} onChange={e=>setName(e.target.value)} style={{ width:'100%', padding:'12px 14px', background:C.bg3, border:`1.5px solid ${C.accent}`, borderRadius:10, fontFamily:F, fontSize:16, color:C.fg1, outline:'none', marginBottom:16 }} />
            <button onClick={()=>setShowRenameSheet(false)} style={{ width:'100%', height:50, background:C.accent, border:'none', borderRadius:12, fontFamily:F, fontSize:16, fontWeight:600, color:'white', cursor:'pointer' }}>Save</button>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── History screen ───────────────────────────────────────────────────────────
const HistoryScreen = ({ onBack, currentTrack, onPlay }) => {
  const [tracks, setTracks] = React.useState(HISTORY);
  const [showClearConfirm, setShowClearConfirm] = React.useState(false);

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', background:C.bg, overflow:'hidden' }}>
      {/* Nav bar */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 8px 4px', flexShrink:0 }}>
        <button onClick={onBack} style={{ display:'flex', alignItems:'center', gap:4, background:'none', border:'none', cursor:'pointer', color:C.accent, fontFamily:F, fontSize:16, height:44, paddingLeft:8 }}>
          <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="9,1 1,9 9,17"/></svg>
          Library
        </button>
        <div style={{ fontFamily:FD, fontSize:17, fontWeight:600, color:C.fg1, position:'absolute', left:'50%', transform:'translateX(-50%)' }}>Recently Played</div>
        <button onClick={() => setShowClearConfirm(true)} style={{ fontFamily:F, fontSize:16, color:C.error, background:'none', border:'none', cursor:'pointer', paddingRight:8 }}>Clear</button>
      </div>

      <div style={{ flex:1, overflowY:'auto' }}>
        {tracks.length === 0 ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'60px 32px', textAlign:'center' }}>
            <div style={{ width:56, height:56, borderRadius:28, background:C.bg2, display:'flex', alignItems:'center', justifyContent:'center', color:C.fg3 }}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
            </div>
            <div style={{ fontFamily:FD, fontSize:18, fontWeight:600, color:C.fg1 }}>Nothing played yet</div>
            <div style={{ fontFamily:F, fontSize:14, color:C.fg2 }}>Search for something to start listening</div>
          </div>
        ) : (
          <div style={{ borderTop:`0.5px solid ${C.sep}` }}>
            {tracks.map((t, i) => (
              <div key={t.videoId} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', borderBottom:`0.5px solid ${C.sep}`, background:C.bg, cursor:'pointer' }} onClick={() => onPlay(t)}>
                <div style={{ width:48, height:48, borderRadius:8, background:currentTrack?.videoId===t.videoId?C.accentTint:C.bg3, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                  {currentTrack?.videoId===t.videoId
                    ? <svg width="16" height="16" viewBox="0 0 24 24" fill={C.accent}><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
                    : <svg width="16" height="16" viewBox="0 0 24 24" fill={C.fg3}><polygon points="5,3 19,12 5,21"/></svg>
                  }
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:F, fontSize:15, fontWeight:500, color:currentTrack?.videoId===t.videoId?C.accent:C.fg1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{t.title}</div>
                  <div style={{ fontFamily:F, fontSize:13, color:C.fg2, marginTop:2, display:'flex', gap:4 }}>
                    <span>{t.channel}</span><span style={{ opacity:0.4 }}>·</span><span>{t.playedAt}</span>
                  </div>
                </div>
                <button style={{ background:'none', border:'none', cursor:'pointer', color:C.fg3 }} onClick={e=>e.stopPropagation()}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Clear confirm action sheet */}
      {showClearConfirm && (
        <div style={{ position:'absolute', inset:0, zIndex:50, display:'flex', flexDirection:'column' }}>
          <div style={{ flex:1, background:'rgba(0,0,0,0.5)' }} onClick={() => setShowClearConfirm(false)} />
          <div style={{ background:C.bg2, borderRadius:'20px 20px 0 0', padding:'20px 16px 40px' }}>
            <div style={{ width:36, height:4, background:C.bg4, borderRadius:2, margin:'0 auto 16px' }} />
            <div style={{ fontFamily:FD, fontSize:17, fontWeight:600, color:C.fg1, textAlign:'center', marginBottom:4 }}>Clear History</div>
            <div style={{ fontFamily:F, fontSize:14, color:C.fg2, textAlign:'center', marginBottom:20 }}>This will remove all recently played entries.</div>
            <button onClick={() => { setTracks([]); setShowClearConfirm(false); }} style={{ width:'100%', height:50, background:'rgba(255,69,58,0.15)', border:`0.5px solid rgba(255,69,58,0.4)`, borderRadius:12, fontFamily:F, fontSize:16, fontWeight:600, color:C.error, cursor:'pointer', marginBottom:8 }}>Clear All</button>
            <button onClick={() => setShowClearConfirm(false)} style={{ width:'100%', height:50, background:C.bg3, border:'none', borderRadius:12, fontFamily:F, fontSize:16, color:C.fg1, cursor:'pointer' }}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Mini player ──────────────────────────────────────────────────────────────
const MiniPlayer = ({ track, playing, progress, onToggle }) => {
  if (!track) return null;
  return (
    <div style={{ padding:'0 10px 6px', flexShrink:0 }}>
      <div style={{ background:'rgba(44,44,46,0.95)', backdropFilter:'blur(30px)', WebkitBackdropFilter:'blur(30px)', borderRadius:16, padding:'10px 12px 12px', position:'relative', overflow:'hidden', boxShadow:'0 4px 24px rgba(0,0,0,0.5)', border:'0.5px solid rgba(255,255,255,0.1)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:46, height:46, borderRadius:9, background:C.accentTint, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill={C.accent}><polygon points="5,3 19,12 5,21"/></svg>
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:F, fontSize:14, fontWeight:500, color:C.fg1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{track.title}</div>
            <div style={{ fontFamily:F, fontSize:12, color:C.fg2, marginTop:1 }}>{track.channel}</div>
          </div>
          <button onClick={onToggle} style={{ width:40, height:40, background:'none', border:'none', cursor:'pointer', color:C.fg1, display:'flex', alignItems:'center', justifyContent:'center' }}>
            {playing ? <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg> : <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>}
          </button>
          <button style={{ width:40, height:40, background:'none', border:'none', cursor:'pointer', color:C.fg2, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
        </div>
        <div style={{ position:'absolute', bottom:0, left:0, right:0, height:2.5, background:C.bg4 }}>
          <div style={{ height:'100%', width:`${progress*100}%`, background:C.accent, transition:'width 1s linear' }} />
        </div>
      </div>
    </div>
  );
};

// ─── App ─────────────────────────────────────────────────────────────────────
const App = () => {
  const [screen, setScreen] = React.useState('library'); // library | playlist | history
  const [activePlaylist, setActivePlaylist] = React.useState(null);
  const [currentTrack, setCurrentTrack] = React.useState(null);
  const [playing, setPlaying] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const timerRef = React.useRef(null);

  React.useEffect(() => {
    if (playing) { timerRef.current = setInterval(() => setProgress(p => Math.min(1, p + 1/(currentTrack?.durationSec||300))), 1000); }
    else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [playing, currentTrack]);

  const play = (t) => { setCurrentTrack(t); setProgress(0); setPlaying(true); };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', background:C.bg }}>
      <StatusBar />
      <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', overflow:'hidden', position:'relative' }}>
        {screen === 'library' && <LibraryScreen onOpenPlaylist={pl => { setActivePlaylist(pl); setScreen('playlist'); }} onOpenHistory={() => setScreen('history')} />}
        {screen === 'playlist' && activePlaylist && <PlaylistDetailScreen playlist={activePlaylist} onBack={() => setScreen('library')} currentTrack={currentTrack} onPlay={play} />}
        {screen === 'history' && <HistoryScreen onBack={() => setScreen('library')} currentTrack={currentTrack} onPlay={play} />}
      </div>
      <MiniPlayer track={currentTrack} playing={playing} progress={progress} onToggle={() => setPlaying(p=>!p)} />
      <TabBar active="library" onChange={() => {}} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
