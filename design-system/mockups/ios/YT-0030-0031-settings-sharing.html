<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT-0030/31 — iOS Settings & Sharing</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;}
.phone{width:393px;height:852px;background:#000;border-radius:52px;box-shadow:0 0 0 2px #3a3a3a,0 40px 100px rgba(0,0,0,0.9),inset 0 0 0 1px #555;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.task-badge{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(139,92,246,0.95);color:white;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px;z-index:1000;letter-spacing:0.03em;pointer-events:none;box-shadow:0 2px 8px rgba(139,92,246,0.5);}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div class="task-badge">YT-0030 · YT-0031 — iOS Settings & Sharing</div>
<div class="phone" id="root"></div>
<script type="text/babel">

const C={bg:'#000',bg2:'#1C1C1E',bg3:'#2C2C2E',bg4:'#3A3A3C',fg1:'#FFFFFF',fg2:'rgba(235,235,245,0.6)',fg3:'rgba(235,235,245,0.3)',accent:'#8B5CF6',error:'#FF453A',success:'#30D158',sep:'rgba(84,84,88,0.65)'};
const F="-apple-system,'SF Pro Text',BlinkMacSystemFont,sans-serif";
const FD="-apple-system,'SF Pro Display',BlinkMacSystemFont,sans-serif";

const StatusBar = () => (
  <div style={{height:54,flexShrink:0,display:'flex',alignItems:'flex-end',justifyContent:'space-between',padding:'0 28px 10px',position:'relative',zIndex:20}}>
    <div style={{position:'absolute',top:10,left:'50%',transform:'translateX(-50%)',width:126,height:36,background:'#000',borderRadius:20}}/>
    <span style={{fontFamily:FD,fontSize:15,fontWeight:600,color:C.fg1}}>9:41</span>
    <div style={{display:'flex',alignItems:'center',gap:6,color:C.fg1}}>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="3" width="3" height="9" rx="1" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" opacity="0.6"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="white" strokeOpacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/></svg>
    </div>
  </div>
);

const TabBar = ({active}) => {
  const tabs=[{id:'search',label:'Search',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>},{id:'library',label:'Library',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>},{id:'settings',label:'Settings',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>}];
  return (
    <div style={{height:83,flexShrink:0,background:'rgba(28,28,30,0.95)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',borderTop:`0.5px solid ${C.sep}`,display:'flex',alignItems:'flex-start',paddingTop:8,zIndex:10}}>
      {tabs.map(t=>{const on=active===t.id;return(<button key={t.id} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'transparent',border:'none',cursor:'pointer',color:on?C.accent:C.fg3}}>{t.icon}<span style={{fontFamily:F,fontSize:10,fontWeight:on?600:400}}>{t.label}</span></button>);})}
    </div>
  );
};

// Toggle
const Toggle = ({value, onChange}) => (
  <div onClick={()=>onChange(!value)} style={{width:51,height:31,borderRadius:15.5,background:value?C.accent:'#3A3A3C',position:'relative',cursor:'pointer',transition:'background 200ms',flexShrink:0}}>
    <div style={{position:'absolute',top:2,left:value?22:2,width:27,height:27,background:'white',borderRadius:'50%',transition:'left 200ms',boxShadow:'0 2px 6px rgba(0,0,0,0.4)'}}/>
  </div>
);

// Form row
const FormRow = ({label,sublabel,icon,right,onTap,isFirst,destructive}) => (
  <div onClick={onTap} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderTop:isFirst?'none':`0.5px solid ${C.sep}`,cursor:onTap?'pointer':'default',minHeight:48}}>
    {icon && <div style={{width:30,height:30,borderRadius:7,background:destructive?'rgba(255,69,58,0.15)':'rgba(139,92,246,0.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:destructive?C.error:C.accent}}>{icon}</div>}
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontFamily:F,fontSize:16,color:destructive?C.error:C.fg1}}>{label}</div>
      {sublabel&&<div style={{fontFamily:F,fontSize:13,color:C.fg2,marginTop:2}}>{sublabel}</div>}
    </div>
    {right}
  </div>
);

const Chev = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.fg3} strokeWidth="2.5" strokeLinecap="round"><polyline points="9,18 15,12 9,6"/></svg>;

// ─── Settings screen ──────────────────────────────────────────────────────────
const SettingsScreen = ({onShowExport, onShowImportError, onShowImportSuccess}) => {
  const [quality, setQuality] = React.useState('high');
  const [notifications, setNotifications] = React.useState(true);
  const [darkMode, setDarkMode] = React.useState(true);
  const [showClearConfirm, setShowClearConfirm] = React.useState(false);

  const qualityLabels = {low:'Low (64 kbps)',medium:'Medium (128 kbps)',high:'High (256 kbps)'};

  return (
    <div style={{flex:1,overflowY:'auto',background:C.bg}}>
      <div style={{padding:'8px 16px 16px'}}>
        <div style={{fontFamily:FD,fontSize:28,fontWeight:700,color:C.fg1,letterSpacing:-0.5}}>Settings</div>
      </div>

      {/* Appearance */}
      <div style={{marginBottom:32}}>
        <div style={{padding:'0 16px 6px',fontFamily:F,fontSize:13,fontWeight:400,color:C.fg3,textTransform:'uppercase',letterSpacing:'0.04em'}}>Appearance</div>
        <div style={{background:C.bg2,borderTop:`0.5px solid ${C.sep}`,borderBottom:`0.5px solid ${C.sep}`}}>
          <FormRow isFirst label="Dark Mode" right={<Toggle value={darkMode} onChange={setDarkMode}/>} />
        </div>
      </div>

      {/* Playback */}
      <div style={{marginBottom:32}}>
        <div style={{padding:'0 16px 6px',fontFamily:F,fontSize:13,color:C.fg3,textTransform:'uppercase',letterSpacing:'0.04em'}}>Playback</div>
        <div style={{background:C.bg2,borderTop:`0.5px solid ${C.sep}`,borderBottom:`0.5px solid ${C.sep}`}}>
          <FormRow isFirst label="Audio Quality" sublabel={qualityLabels[quality]}
            right={
              <div style={{display:'flex',gap:0,background:C.bg3,borderRadius:8,overflow:'hidden'}}>
                {['low','medium','high'].map(q=>(
                  <button key={q} onClick={()=>setQuality(q)} style={{padding:'5px 10px',background:quality===q?C.accent:'transparent',border:'none',cursor:'pointer',fontFamily:F,fontSize:12,color:quality===q?'white':C.fg2,fontWeight:quality===q?600:400,transition:'all 150ms'}}>
                    {q==='low'?'Lo':q==='medium'?'Mid':'Hi'}
                  </button>
                ))}
              </div>
            }
          />
        </div>
      </div>

      {/* Playlists */}
      <div style={{marginBottom:32}}>
        <div style={{padding:'0 16px 6px',fontFamily:F,fontSize:13,color:C.fg3,textTransform:'uppercase',letterSpacing:'0.04em'}}>Playlists</div>
        <div style={{background:C.bg2,borderTop:`0.5px solid ${C.sep}`,borderBottom:`0.5px solid ${C.sep}`}}>
          <FormRow isFirst label="Export All Playlists"
            icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>}
            right={<Chev/>} onTap={onShowExport}
          />
          <FormRow label="Import Playlist"
            icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>}
            right={<Chev/>} onTap={onShowImportSuccess}
          />
        </div>
      </div>

      {/* Data */}
      <div style={{marginBottom:32}}>
        <div style={{padding:'0 16px 6px',fontFamily:F,fontSize:13,color:C.fg3,textTransform:'uppercase',letterSpacing:'0.04em'}}>Data</div>
        <div style={{background:C.bg2,borderTop:`0.5px solid ${C.sep}`,borderBottom:`0.5px solid ${C.sep}`}}>
          <FormRow isFirst label="Clear Cache"
            icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>}
            sublabel="Removes temporary stream and artwork files"
            right={<Chev/>} onTap={()=>setShowClearConfirm(true)}
          />
          <FormRow label="Clear History"
            icon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>}
            right={<Chev/>} destructive
          />
        </div>
      </div>

      {/* About */}
      <div style={{marginBottom:40}}>
        <div style={{padding:'0 16px 6px',fontFamily:F,fontSize:13,color:C.fg3,textTransform:'uppercase',letterSpacing:'0.04em'}}>About</div>
        <div style={{background:C.bg2,borderTop:`0.5px solid ${C.sep}`,borderBottom:`0.5px solid ${C.sep}`}}>
          <FormRow isFirst label="Version" right={<span style={{fontFamily:F,fontSize:15,color:C.fg3}}>0.1.0 (MVP)</span>} />
          <FormRow label="Personal Use Only" right={<span style={{fontFamily:F,fontSize:13,color:C.fg3,textAlign:'right',maxWidth:160}}>No backend · streams resolved locally</span>} />
        </div>
      </div>

      {/* Clear confirm sheet */}
      {showClearConfirm && (
        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',flexDirection:'column'}}>
          <div style={{flex:1,background:'rgba(0,0,0,0.5)'}} onClick={()=>setShowClearConfirm(false)}/>
          <div style={{background:C.bg2,borderRadius:'20px 20px 0 0',padding:'20px 16px 40px'}}>
            <div style={{width:36,height:4,background:C.bg4,borderRadius:2,margin:'0 auto 16px'}}/>
            <div style={{fontFamily:FD,fontSize:17,fontWeight:600,color:C.fg1,textAlign:'center',marginBottom:4}}>Clear Cache?</div>
            <div style={{fontFamily:F,fontSize:14,color:C.fg2,textAlign:'center',marginBottom:20}}>Temporary stream and artwork files will be deleted.</div>
            <button onClick={()=>setShowClearConfirm(false)} style={{width:'100%',height:50,background:'rgba(255,69,58,0.15)',border:`0.5px solid rgba(255,69,58,0.4)`,borderRadius:12,fontFamily:F,fontSize:16,fontWeight:600,color:C.error,cursor:'pointer',marginBottom:8}}>Clear Cache</button>
            <button onClick={()=>setShowClearConfirm(false)} style={{width:'100%',height:50,background:C.bg3,border:'none',borderRadius:12,fontFamily:F,fontSize:16,color:C.fg1,cursor:'pointer'}}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
};

// ─── Share sheet (iOS native style) ──────────────────────────────────────────
const ShareSheet = ({onClose, playlistName='Lofi Chill'}) => {
  const actions = [
    {label:'AirDrop',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.8" strokeLinecap="round"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/><polygon points="12,15 17,21 7,21"/></svg>},
    {label:'Files',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.8" strokeLinecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13,2 13,9 20,9"/></svg>},
    {label:'Mail',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.8" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>},
    {label:'Messages',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.8" strokeLinecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>},
  ];
  return (
    <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,background:'rgba(0,0,0,0.4)'}} onClick={onClose}/>
      <div style={{background:'#1C1C1E',borderRadius:'20px 20px 0 0',paddingBottom:40}}>
        {/* File preview */}
        <div style={{padding:'16px 16px 12px',borderBottom:`0.5px solid rgba(84,84,88,0.65)`}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:48,height:48,borderRadius:10,background:'rgba(139,92,246,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="1.8" strokeLinecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13,2 13,9 20,9"/></svg>
            </div>
            <div>
              <div style={{fontFamily:F,fontSize:15,fontWeight:500,color:C.fg1}}>{playlistName}.ytplaylist.json</div>
              <div style={{fontFamily:F,fontSize:13,color:C.fg2,marginTop:2}}>YourTube Playlist · 24 tracks</div>
            </div>
          </div>
        </div>
        {/* Share targets */}
        <div style={{padding:'16px 0 8px',display:'flex',justifyContent:'space-around'}}>
          {actions.map(a=>(
            <div key={a.label} onClick={onClose} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,cursor:'pointer',padding:'0 8px'}}>
              <div style={{width:60,height:60,borderRadius:14,background:C.bg3,display:'flex',alignItems:'center',justifyContent:'center'}}>{a.icon}</div>
              <span style={{fontFamily:F,fontSize:12,color:C.fg2}}>{a.label}</span>
            </div>
          ))}
        </div>
        {/* Actions */}
        <div style={{margin:'8px 16px 0',background:C.bg3,borderRadius:12,overflow:'hidden'}}>
          {[
            {label:'Copy',icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>},
            {label:'Save to Files',icon:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>},
          ].map((a,i)=>(
            <div key={a.label} onClick={onClose} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',borderTop:i>0?`0.5px solid ${C.sep}`:'none',cursor:'pointer'}}>
              {a.icon}
              <span style={{fontFamily:F,fontSize:16,color:C.fg1}}>{a.label}</span>
            </div>
          ))}
        </div>
        <button onClick={onClose} style={{display:'block',width:'calc(100% - 32px)',margin:'12px 16px 0',height:50,background:C.bg3,border:'none',borderRadius:12,fontFamily:F,fontSize:17,fontWeight:600,color:C.accent,cursor:'pointer'}}>Cancel</button>
      </div>
    </div>
  );
};

// ─── Import result sheet ──────────────────────────────────────────────────────
const ImportSheet = ({success, onClose}) => (
  <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',flexDirection:'column'}}>
    <div style={{flex:1,background:'rgba(0,0,0,0.5)'}} onClick={onClose}/>
    <div style={{background:C.bg2,borderRadius:'20px 20px 0 0',padding:'28px 16px 44px',display:'flex',flexDirection:'column',alignItems:'center',gap:12,textAlign:'center'}}>
      <div style={{width:64,height:64,borderRadius:32,background:success?'rgba(48,209,88,0.15)':'rgba(255,69,58,0.15)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        {success
          ? <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={C.success} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
          : <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={C.error} strokeWidth="2.5" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        }
      </div>
      {success ? (
        <>
          <div style={{fontFamily:FD,fontSize:20,fontWeight:700,color:C.fg1}}>Playlist Imported</div>
          <div style={{fontFamily:F,fontSize:15,color:C.fg2}}>Lofi Chill was added to your library.</div>
          <button onClick={onClose} style={{marginTop:8,width:'100%',height:50,background:C.accent,border:'none',borderRadius:12,fontFamily:F,fontSize:16,fontWeight:600,color:'white',cursor:'pointer'}}>Done</button>
        </>
      ) : (
        <>
          <div style={{fontFamily:FD,fontSize:20,fontWeight:700,color:C.error}}>Import Failed</div>
          <div style={{fontFamily:F,fontSize:15,color:C.fg2}}>This playlist was made with a newer version of YourTube. Please update the app.</div>
          <button onClick={onClose} style={{marginTop:8,width:'100%',height:50,background:C.bg3,border:'none',borderRadius:12,fontFamily:F,fontSize:16,color:C.fg1,cursor:'pointer'}}>OK</button>
        </>
      )}
    </div>
  </div>
);

// ─── App ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [sheet, setSheet] = React.useState(null); // null | 'export' | 'import-ok' | 'import-err'

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:C.bg,position:'relative'}}>
      <StatusBar/>
      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <SettingsScreen
          onShowExport={()=>setSheet('export')}
          onShowImportSuccess={()=>setSheet('import-ok')}
          onShowImportError={()=>setSheet('import-err')}
        />
      </div>
      <TabBar active="settings"/>
      {sheet==='export' && <ShareSheet onClose={()=>setSheet(null)}/>}
      {sheet==='import-ok' && <ImportSheet success={true} onClose={()=>setSheet(null)}/>}
      {sheet==='import-err' && <ImportSheet success={false} onClose={()=>setSheet(null)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
