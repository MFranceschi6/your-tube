<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT-0014/15/16/17 — Android Library, History, Settings, Sharing</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-family:'Roboto',sans-serif;}
.phone{width:393px;height:852px;background:#0F0F12;border-radius:44px;box-shadow:0 0 0 2px #3a3a3a,0 40px 100px rgba(0,0,0,0.9),inset 0 0 0 1px #555;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.task-badge{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(103,80,164,0.95);color:white;font-size:11px;font-weight:500;padding:4px 12px;border-radius:999px;z-index:1000;letter-spacing:0.03em;pointer-events:none;box-shadow:0 2px 8px rgba(103,80,164,0.5);}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div class="task-badge">YT-0014 · YT-0015 · YT-0016 · YT-0017 — Android Library, History, Settings, Sharing</div>
<div class="phone" id="root"></div>
<script type="text/babel">

const PALETTES={
  purple:{primary:'#D0BCFF',onPrimary:'#381E72',primaryContainer:'#4F378B',onPrimaryContainer:'#EADDFF',surface:'#1C1B1F',surfaceVariant:'#49454F',bg:'#141218',onSurface:'#E6E1E5',onSurfaceVariant:'#CAC4D0',outline:'#938F99',error:'#F2B8B8',onError:'#601410',name:'Purple'},
  blue:{primary:'#A8C7FA',onPrimary:'#0A305F',primaryContainer:'#28548C',onPrimaryContainer:'#D3E4FF',surface:'#1A1C1E',surfaceVariant:'#43474E',bg:'#111318',onSurface:'#E2E2E9',onSurfaceVariant:'#C3C7CF',outline:'#8D9199',error:'#FFB4AB',onError:'#690005',name:'Blue'},
};

const PLAYLISTS=[
  {id:'p1',name:'Lofi Chill',trackCount:24,colors:['#3D1F7A','#1F3A7A','#1F6A4A','#6A3A1F']},
  {id:'p2',name:'Rock Classics',trackCount:18,colors:['#7A1F1F','#4A3A1F','#1F4A3A','#3A1F7A']},
  {id:'p3',name:'Focus Mode',trackCount:12,colors:['#1F4A6A','#3A4A1F','#1F1F7A','#6A4A1F']},
];
const HISTORY=[
  {videoId:'h1',title:'Stairway to Heaven',channel:'Led Zeppelin',durationSec:482,playedAt:'Today, 10:32'},
  {videoId:'h2',title:'Hotel California',channel:'Eagles',durationSec:438,playedAt:'Today, 09:14'},
  {videoId:'h3',title:'Bohemian Rhapsody',channel:'Queen',durationSec:355,playedAt:'Yesterday'},
  {videoId:'h4',title:'Comfortably Numb',channel:'Pink Floyd',durationSec:382,playedAt:'Yesterday'},
  {videoId:'h5',title:'November Rain',channel:"Guns N' Roses",durationSec:537,playedAt:'2 days ago'},
];
const PLAYLIST_TRACKS=[
  {videoId:'t1',title:'Bohemian Rhapsody',channel:'Queen',durationSec:355},
  {videoId:'t2',title:'Hotel California',channel:'Eagles',durationSec:438},
  {videoId:'t3',title:'Stairway to Heaven',channel:'Led Zeppelin',durationSec:482},
  {videoId:'t4',title:'Comfortably Numb',channel:'Pink Floyd',durationSec:382},
  {videoId:'t5',title:"November Rain",channel:"Guns N' Roses",durationSec:537},
];
const fmt=s=>{if(!s)return'Live';const m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`;};

// ── Status Bar ────────────────────────────────────────────────────────────────
const StatusBar=({pal})=>(
  <div style={{height:28,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 16px',zIndex:20}}>
    <span style={{fontFamily:'Roboto',fontSize:12,fontWeight:500,color:pal.onSurface,letterSpacing:0.4}}>9:41</span>
    <div style={{display:'flex',alignItems:'center',gap:4,color:pal.onSurface}}>
      <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" opacity="0.7"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="22" height="11" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" strokeOpacity="0.5"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/></svg>
    </div>
  </div>
);

// ── Nav Bar ───────────────────────────────────────────────────────────────────
const NavBar=({active,onChange,pal})=>{
  const tabs=[
    {id:'library',label:'Library',icon:a=>(
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {a&&<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" fill="currentColor" fillOpacity="0.15" stroke="none"/>}
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
      </svg>
    )},
    {id:'history',label:'History',icon:a=>(
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
        {a&&<circle cx="12" cy="12" r="3" fill="currentColor" fillOpacity="0.3" stroke="none"/>}
      </svg>
    )},
    {id:'settings',label:'Settings',icon:a=>(
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3" fill={a?"currentColor":"none"} fillOpacity="0.3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    )},
  ];
  return(
    <div style={{height:80,flexShrink:0,background:pal.surface,display:'flex',alignItems:'flex-start',paddingTop:12,zIndex:10}}>
      {tabs.map(t=>{const on=active===t.id;return(
        <button key={t.id} onClick={()=>onChange(t.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,background:'transparent',border:'none',cursor:'pointer',color:on?pal.primary:pal.onSurfaceVariant,transition:'color 150ms'}}>
          <div style={{width:64,height:32,borderRadius:16,background:on?pal.primaryContainer+'55':'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'background 200ms'}}>{t.icon(on)}</div>
          <span style={{fontFamily:'Roboto',fontSize:12,fontWeight:on?500:400,letterSpacing:0.4}}>{t.label}</span>
        </button>
      );})}
    </div>
  );
};

// ── Cover ─────────────────────────────────────────────────────────────────────
const Cover=({colors,size=52})=>(
  <div style={{width:size,height:size,borderRadius:4,overflow:'hidden',flexShrink:0,display:'grid',gridTemplateColumns:'1fr 1fr',gap:2,background:'#333'}}>
    {colors.map((c,i)=><div key={i} style={{background:c}}/>)}
  </div>
);

// ── Library Screen ────────────────────────────────────────────────────────────
const LibraryScreen=({pal,onOpenPlaylist,onShowShare,currentTrack})=>{
  const [showFab,setShowFab]=React.useState(true);
  const [showNewDialog,setShowNewDialog]=React.useState(false);
  const [newName,setNewName]=React.useState('');

  return(
    <div style={{flex:1,overflowY:'auto',background:pal.bg,position:'relative'}}>
      {/* Top app bar */}
      <div style={{padding:'12px 16px 8px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontFamily:'Roboto',fontSize:22,fontWeight:700,color:pal.onSurface,letterSpacing:-0.3}}>Library</div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={onShowShare} style={{width:40,height:40,borderRadius:20,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}} title="Import playlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
        </div>
      </div>

      {/* Playlists */}
      {PLAYLISTS.map((pl,i)=>(
        <div key={pl.id} onClick={()=>onOpenPlaylist(pl)} style={{display:'flex',alignItems:'center',gap:16,padding:'10px 16px',cursor:'pointer',transition:'background 150ms'}}
          onMouseEnter={e=>e.currentTarget.style.background=pal.onSurface+'10'}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <Cover colors={pl.colors}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onSurface,letterSpacing:0.1}}>{pl.name}</div>
            <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,marginTop:2,letterSpacing:0.4}}>{pl.trackCount} tracks</div>
          </div>
          <button style={{width:40,height:40,borderRadius:20,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={e=>e.stopPropagation()}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </button>
        </div>
      ))}

      {/* Empty state padding */}
      <div style={{height:80}}/>

      {/* FAB — M3 Extended FAB */}
      <button onClick={()=>setShowNewDialog(true)} style={{position:'absolute',bottom:16,right:16,height:56,padding:'0 20px',background:pal.primaryContainer,border:'none',borderRadius:16,cursor:'pointer',display:'flex',alignItems:'center',gap:10,boxShadow:'0 4px 12px rgba(0,0,0,0.4)',color:pal.onPrimaryContainer,fontFamily:'Roboto',fontSize:14,fontWeight:500,letterSpacing:0.1,transition:'box-shadow 150ms'}}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Playlist
      </button>

      {/* New playlist dialog (M3 style) */}
      {showNewDialog&&(
        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.5)'}}>
          <div style={{background:pal.surface,borderRadius:28,padding:'24px',width:320,boxShadow:'0 8px 32px rgba(0,0,0,0.5)'}}>
            <div style={{fontFamily:'Roboto',fontSize:20,fontWeight:500,color:pal.onSurface,marginBottom:16}}>New Playlist</div>
            <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Playlist name" style={{width:'100%',padding:'14px 16px',background:pal.bg,border:`1px solid ${newName?pal.primary:pal.outline}`,borderRadius:4,fontFamily:'Roboto',fontSize:16,color:pal.onSurface,outline:'none',marginBottom:24,letterSpacing:0.5}} autoFocus/>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
              <button onClick={()=>{setShowNewDialog(false);setNewName('');}} style={{padding:'10px 24px',background:'transparent',border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.primary,cursor:'pointer',letterSpacing:0.1}}>Cancel</button>
              <button onClick={()=>setShowNewDialog(false)} style={{padding:'10px 24px',background:pal.primary,border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimary,cursor:'pointer',letterSpacing:0.1}}>Create</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ── Playlist Detail ───────────────────────────────────────────────────────────
const PlaylistDetailScreen=({playlist,pal,onBack,currentTrack,onPlay})=>{
  const [tracks,setTracks]=React.useState(PLAYLIST_TRACKS);
  const [editMode,setEditMode]=React.useState(false);

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:pal.bg,overflow:'hidden'}}>
      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',gap:4,padding:'4px 4px 4px',flexShrink:0}}>
        <button onClick={onBack} style={{width:48,height:48,borderRadius:24,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="15,18 9,12 15,6"/></svg>
        </button>
        <div style={{flex:1,fontFamily:'Roboto',fontSize:20,fontWeight:500,color:pal.onSurface,letterSpacing:0.15}}>{playlist.name}</div>
        <button onClick={()=>setEditMode(e=>!e)} style={{padding:'0 16px',height:36,background:editMode?pal.primaryContainer:pal.surfaceVariant,border:'none',borderRadius:8,fontFamily:'Roboto',fontSize:13,fontWeight:500,color:editMode?pal.primary:pal.onSurface,cursor:'pointer',letterSpacing:0.1}}>
          {editMode?'Done':'Edit'}
        </button>
        <button style={{width:48,height:48,borderRadius:24,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>

      <div style={{flex:1,overflowY:'auto'}}>
        {/* Header */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'12px 16px 20px',gap:12}}>
          <Cover colors={playlist.colors} size={140}/>
          <div style={{textAlign:'center'}}>
            <div style={{fontFamily:'Roboto',fontSize:20,fontWeight:700,color:pal.onSurface,letterSpacing:-0.3}}>{playlist.name}</div>
            <div style={{fontFamily:'Roboto',fontSize:13,color:pal.onSurfaceVariant,marginTop:2,letterSpacing:0.4}}>{tracks.length} tracks</div>
          </div>
          <div style={{display:'flex',gap:12}}>
            <button onClick={()=>onPlay(tracks[0])} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 24px',background:pal.primary,border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimary,cursor:'pointer',letterSpacing:0.1}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>Play
            </button>
            <button style={{display:'flex',alignItems:'center',gap:8,padding:'10px 20px',background:pal.surfaceVariant,border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onSurface,cursor:'pointer',letterSpacing:0.1}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/></svg>Shuffle
            </button>
          </div>
        </div>

        {/* Track list */}
        {tracks.map((t,i)=>(
          <div key={t.videoId} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 16px',cursor:'pointer',background:currentTrack?.videoId===t.videoId?pal.primaryContainer+'22':'transparent',borderTop:i===0?`0.5px solid ${pal.outline}33`:'none',borderBottom:`0.5px solid ${pal.outline}33`}}>
            {editMode&&(
              <button onClick={()=>setTracks(ts=>ts.filter(x=>x.videoId!==t.videoId))} style={{width:24,height:24,borderRadius:12,background:pal.error,border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:pal.onError}}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            )}
            <div style={{width:44,height:44,borderRadius:4,background:currentTrack?.videoId===t.videoId?pal.primaryContainer:pal.surfaceVariant+'66',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}} onClick={()=>onPlay(t)}>
              {currentTrack?.videoId===t.videoId?<svg width="14" height="14" viewBox="0 0 24 24" fill={pal.primary}><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>:<svg width="14" height="14" viewBox="0 0 24 24" fill={pal.onSurfaceVariant} opacity="0.5"><polygon points="5,3 19,12 5,21"/></svg>}
            </div>
            <div style={{flex:1,minWidth:0}} onClick={()=>onPlay(t)}>
              <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:currentTrack?.videoId===t.videoId?500:400,color:currentTrack?.videoId===t.videoId?pal.primary:pal.onSurface,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',letterSpacing:0.25}}>{t.title}</div>
              <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,marginTop:2,letterSpacing:0.4,display:'flex',gap:4}}>
                <span>{t.channel}</span><span>·</span><span style={{fontVariantNumeric:'tabular-nums'}}>{fmt(t.durationSec)}</span>
              </div>
            </div>
            {editMode
              ?<div style={{color:pal.onSurfaceVariant,cursor:'grab',display:'flex',alignItems:'center'}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>
              </div>
              :<button style={{width:40,height:40,borderRadius:20,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={e=>e.stopPropagation()}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
              </button>
            }
          </div>
        ))}
        <div style={{height:16}}/>
      </div>
    </div>
  );
};

// ── History Screen ────────────────────────────────────────────────────────────
const HistoryScreen=({pal,currentTrack,onPlay})=>{
  const [tracks,setTracks]=React.useState(HISTORY);
  const [showConfirm,setShowConfirm]=React.useState(false);

  return(
    <div style={{flex:1,display:'flex',flexDirection:'column',background:pal.bg,overflow:'hidden'}}>
      <div style={{padding:'12px 16px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{fontFamily:'Roboto',fontSize:22,fontWeight:700,color:pal.onSurface,letterSpacing:-0.3}}>Recently Played</div>
        <button onClick={()=>setShowConfirm(true)} style={{padding:'0 16px',height:36,background:'transparent',border:`1px solid ${pal.outline}`,borderRadius:8,fontFamily:'Roboto',fontSize:13,fontWeight:500,color:pal.onSurfaceVariant,cursor:'pointer',letterSpacing:0.1}}>Clear all</button>
      </div>

      <div style={{flex:1,overflowY:'auto'}}>
        {tracks.length===0?(
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,padding:'60px 32px',textAlign:'center'}}>
            <div style={{width:64,height:64,borderRadius:32,background:pal.surface,display:'flex',alignItems:'center',justifyContent:'center',color:pal.onSurfaceVariant}}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
            </div>
            <div style={{fontFamily:'Roboto',fontSize:18,fontWeight:500,color:pal.onSurface,letterSpacing:0.15}}>Nothing played yet</div>
            <div style={{fontFamily:'Roboto',fontSize:14,color:pal.onSurfaceVariant,letterSpacing:0.25}}>Search for something to start listening</div>
          </div>
        ):(
          tracks.map((t,i)=>(
            <div key={t.videoId} onClick={()=>onPlay(t)} style={{display:'flex',alignItems:'center',gap:16,padding:'8px 16px',cursor:'pointer',background:currentTrack?.videoId===t.videoId?pal.primaryContainer+'22':'transparent',transition:'background 150ms',borderBottom:`0.5px solid ${pal.outline}22`}}
              onMouseEnter={e=>e.currentTarget.style.background=pal.onSurface+'10'}
              onMouseLeave={e=>e.currentTarget.style.background=currentTrack?.videoId===t.videoId?pal.primaryContainer+'22':'transparent'}>
              <div style={{width:52,height:52,borderRadius:4,background:currentTrack?.videoId===t.videoId?pal.primaryContainer:pal.surfaceVariant+'66',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                {currentTrack?.videoId===t.videoId?<svg width="16" height="16" viewBox="0 0 24 24" fill={pal.primary}><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>:<svg width="16" height="16" viewBox="0 0 24 24" fill={pal.onSurfaceVariant} opacity="0.5"><polygon points="5,3 19,12 5,21"/></svg>}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:500,color:currentTrack?.videoId===t.videoId?pal.primary:pal.onSurface,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',letterSpacing:0.25}}>{t.title}</div>
                <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,marginTop:2,letterSpacing:0.4,display:'flex',gap:4}}>
                  <span>{t.channel}</span><span>·</span><span>{t.playedAt}</span>
                </div>
              </div>
              <button style={{width:40,height:40,borderRadius:20,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={e=>e.stopPropagation()}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
              </button>
            </div>
          ))
        )}
      </div>

      {/* M3 Dialog — confirm clear */}
      {showConfirm&&(
        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.5)'}}>
          <div style={{background:pal.surface,borderRadius:28,padding:'24px',width:320,boxShadow:'0 8px 32px rgba(0,0,0,0.5)'}}>
            <div style={{fontFamily:'Roboto',fontSize:20,fontWeight:500,color:pal.onSurface,marginBottom:12}}>Clear History?</div>
            <div style={{fontFamily:'Roboto',fontSize:14,color:pal.onSurfaceVariant,marginBottom:24,lineHeight:1.5}}>All recently played entries will be removed.</div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
              <button onClick={()=>setShowConfirm(false)} style={{padding:'10px 24px',background:'transparent',border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.primary,cursor:'pointer'}}>Cancel</button>
              <button onClick={()=>{setTracks([]);setShowConfirm(false);}} style={{padding:'10px 24px',background:pal.error,border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onError,cursor:'pointer'}}>Clear</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ── Settings Screen ───────────────────────────────────────────────────────────
const SettingsScreen=({pal,onShowExport,onShowImport})=>{
  const [quality,setQuality]=React.useState('high');
  const [dark,setDark]=React.useState(true);
  const [showCacheDialog,setShowCacheDialog]=React.useState(false);

  const Switch=({value,onChange})=>(
    <div onClick={()=>onChange(!value)} style={{width:52,height:32,borderRadius:16,background:value?pal.primary:pal.surfaceVariant,position:'relative',cursor:'pointer',transition:'background 200ms',flexShrink:0}}>
      <div style={{position:'absolute',top:3,left:value?24:3,width:26,height:26,background:value?pal.onPrimary:'#888',borderRadius:13,transition:'left 200ms',boxShadow:'0 2px 4px rgba(0,0,0,0.4)'}}/>
    </div>
  );

  return(
    <div style={{flex:1,overflowY:'auto',background:pal.bg}}>
      <div style={{padding:'12px 16px 8px'}}>
        <div style={{fontFamily:'Roboto',fontSize:22,fontWeight:700,color:pal.onSurface,letterSpacing:-0.3}}>Settings</div>
      </div>

      {[
        {title:'Appearance',items:[
          {label:'Dark Mode',sub:'Follows system by default',right:<Switch value={dark} onChange={setDark}/>},
        ]},
        {title:'Playback',items:[
          {label:'Audio Quality',sub:{low:'64 kbps',medium:'128 kbps',high:'256 kbps'}[quality],
            right:<div style={{display:'flex',gap:1,background:pal.surfaceVariant,borderRadius:8,overflow:'hidden'}}>
              {['low','med','hi'].map((q,i)=>{const k=['low','medium','high'][i];return(
                <button key={k} onClick={()=>setQuality(k)} style={{padding:'5px 10px',background:quality===k?pal.primary:'transparent',border:'none',cursor:'pointer',fontFamily:'Roboto',fontSize:12,fontWeight:quality===k?500:400,color:quality===k?pal.onPrimary:pal.onSurfaceVariant,transition:'all 150ms'}}>{q}</button>
              );})}
            </div>
          },
        ]},
        {title:'Playlists',items:[
          {label:'Export all playlists',sub:'Share as .ytplaylist.json',right:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={pal.onSurfaceVariant} strokeWidth="2" strokeLinecap="round"><polyline points="9,18 15,12 9,6"/></svg>,onTap:onShowExport},
          {label:'Import playlist',sub:'Open .ytplaylist.json file',right:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={pal.onSurfaceVariant} strokeWidth="2" strokeLinecap="round"><polyline points="9,18 15,12 9,6"/></svg>,onTap:onShowImport},
        ]},
        {title:'Data',items:[
          {label:'Clear cache',sub:'Removes temporary stream and artwork files',right:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={pal.onSurfaceVariant} strokeWidth="2" strokeLinecap="round"><polyline points="9,18 15,12 9,6"/></svg>,onTap:()=>setShowCacheDialog(true)},
          {label:'Clear history',sub:'Remove all recently played entries',right:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={pal.error} strokeWidth="2" strokeLinecap="round"><polyline points="9,18 15,12 9,6"/></svg>,destructive:true},
        ]},
        {title:'About',items:[
          {label:'Version',sub:'0.1.0 (MVP)',right:null},
          {label:'Personal use only',sub:'No backend — streams resolved locally',right:null},
        ]},
      ].map(section=>(
        <div key={section.title} style={{marginBottom:8}}>
          <div style={{padding:'16px 16px 4px',fontFamily:'Roboto',fontSize:12,fontWeight:500,color:pal.primary,letterSpacing:'0.1em',textTransform:'uppercase'}}>{section.title}</div>
          {section.items.map((item,i)=>(
            <div key={item.label} onClick={item.onTap} style={{display:'flex',alignItems:'center',gap:16,padding:'14px 16px',cursor:item.onTap?'pointer':'default',borderTop:`0.5px solid ${pal.outline}22`,transition:'background 150ms',...(item.onTap?{}:{})}}
              onMouseEnter={e=>{if(item.onTap)e.currentTarget.style.background=pal.onSurface+'10';}}
              onMouseLeave={e=>{if(item.onTap)e.currentTarget.style.background='transparent';}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:400,color:item.destructive?pal.error:pal.onSurface,letterSpacing:0.25}}>{item.label}</div>
                {item.sub&&<div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,marginTop:2,letterSpacing:0.4}}>{item.sub}</div>}
              </div>
              {item.right}
            </div>
          ))}
        </div>
      ))}

      {showCacheDialog&&(
        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.5)'}}>
          <div style={{background:pal.surface,borderRadius:28,padding:'24px',width:320,boxShadow:'0 8px 32px rgba(0,0,0,0.5)'}}>
            <div style={{fontFamily:'Roboto',fontSize:20,fontWeight:500,color:pal.onSurface,marginBottom:12}}>Clear Cache?</div>
            <div style={{fontFamily:'Roboto',fontSize:14,color:pal.onSurfaceVariant,marginBottom:24,lineHeight:1.5}}>Temporary stream and artwork files will be deleted.</div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
              <button onClick={()=>setShowCacheDialog(false)} style={{padding:'10px 24px',background:'transparent',border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.primary,cursor:'pointer'}}>Cancel</button>
              <button onClick={()=>setShowCacheDialog(false)} style={{padding:'10px 24px',background:pal.primary,border:'none',borderRadius:999,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimary,cursor:'pointer'}}>Clear</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ── Share bottom sheet (Android style) ───────────────────────────────────────
const ShareSheet=({pal,onClose,mode})=>(
  <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',flexDirection:'column'}}>
    <div style={{flex:1,background:'rgba(0,0,0,0.5)'}} onClick={onClose}/>
    <div style={{background:pal.surface,borderRadius:'28px 28px 0 0',paddingBottom:32}}>
      <div style={{width:32,height:4,background:pal.outline+'55',borderRadius:2,margin:'12px auto 16px'}}/>
      {mode==='export'?(
        <>
          <div style={{padding:'0 16px 16px',display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:48,height:48,borderRadius:8,background:pal.primaryContainer,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={pal.onPrimaryContainer} strokeWidth="1.8" strokeLinecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13,2 13,9 20,9"/></svg>
            </div>
            <div>
              <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onSurface}}>Lofi Chill.ytplaylist.json</div>
              <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,marginTop:2}}>24 tracks · YourTube Playlist</div>
            </div>
          </div>
          <div style={{padding:'0 16px',display:'flex',gap:16,justifyContent:'space-around',marginBottom:16}}>
            {[{l:'Nearby Share',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={pal.primary} strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>},
              {l:'Gmail',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={pal.primary} strokeWidth="1.8" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>},
              {l:'Files',icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={pal.primary} strokeWidth="1.8" strokeLinecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13,2 13,9 20,9"/></svg>},
            ].map(a=>(
              <div key={a.l} onClick={onClose} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,cursor:'pointer'}}>
                <div style={{width:56,height:56,borderRadius:28,background:pal.surfaceVariant,display:'flex',alignItems:'center',justifyContent:'center'}}>{a.icon}</div>
                <span style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,letterSpacing:0.4}}>{a.l}</span>
              </div>
            ))}
          </div>
        </>
      ):(
        <div style={{padding:'16px 16px 24px',textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
          <div style={{width:64,height:64,borderRadius:32,background:'rgba(48,209,88,0.15)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#30D158" strokeWidth="2.5" strokeLinecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
          </div>
          <div style={{fontFamily:'Roboto',fontSize:18,fontWeight:500,color:pal.onSurface}}>Playlist Imported</div>
          <div style={{fontFamily:'Roboto',fontSize:14,color:pal.onSurfaceVariant}}>Lofi Chill was added to your library.</div>
        </div>
      )}
      <div style={{margin:'0 16px'}}>
        <button onClick={onClose} style={{width:'100%',height:48,background:pal.primaryContainer,border:'none',borderRadius:12,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimaryContainer,cursor:'pointer',letterSpacing:0.1}}>
          {mode==='export'?'Cancel':'Done'}
        </button>
      </div>
    </div>
  </div>
);

// ── Color picker ──────────────────────────────────────────────────────────────
const ColorPicker=({current,onChange})=>(
  <div style={{padding:'4px 16px 8px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
    <span style={{fontFamily:'Roboto',fontSize:11,color:'rgba(255,255,255,0.4)',letterSpacing:'0.08em',textTransform:'uppercase',flexShrink:0}}>Dynamic color:</span>
    {Object.entries(PALETTES).map(([k,p])=>(
      <button key={k} onClick={()=>onChange(k)} title={p.name} style={{width:20,height:20,borderRadius:10,background:p.primary,border:current===k?'2px solid white':'2px solid transparent',cursor:'pointer',transition:'transform 150ms',transform:current===k?'scale(1.25)':'scale(1)'}}/>
    ))}
  </div>
);

// ── App ───────────────────────────────────────────────────────────────────────
const App=()=>{
  const [palKey,setPalKey]=React.useState('purple');
  const [tab,setTab]=React.useState('library');
  const [subscreen,setSubscreen]=React.useState(null); // null | {type:'playlist',pl}
  const [currentTrack,setCurrentTrack]=React.useState(null);
  const [playing,setPlaying]=React.useState(false);
  const [progress,setProgress]=React.useState(0);
  const [sheet,setSheet]=React.useState(null); // null | 'export' | 'import'
  const timerRef=React.useRef(null);
  const pal=PALETTES[palKey];

  React.useEffect(()=>{
    if(playing){timerRef.current=setInterval(()=>setProgress(p=>Math.min(1,p+1/(currentTrack?.durationSec||300))),1000);}
    else clearInterval(timerRef.current);
    return()=>clearInterval(timerRef.current);
  },[playing,currentTrack]);

  const play=(t)=>{setCurrentTrack(t);setProgress(0);setPlaying(true);};

  const renderMain=()=>{
    if(subscreen?.type==='playlist') return <PlaylistDetailScreen playlist={subscreen.pl} pal={pal} onBack={()=>setSubscreen(null)} currentTrack={currentTrack} onPlay={play}/>;
    if(tab==='library') return <LibraryScreen pal={pal} onOpenPlaylist={pl=>setSubscreen({type:'playlist',pl})} onShowShare={()=>setSheet('export')} currentTrack={currentTrack}/>;
    if(tab==='history') return <HistoryScreen pal={pal} currentTrack={currentTrack} onPlay={play}/>;
    if(tab==='settings') return <SettingsScreen pal={pal} onShowExport={()=>setSheet('export')} onShowImport={()=>setSheet('import')}/>;
  };

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:pal.bg,position:'relative'}}>
      <StatusBar pal={pal}/>
      <ColorPicker current={palKey} onChange={setPalKey}/>
      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {renderMain()}
      </div>
      {/* MiniPlayer */}
      {currentTrack&&(
        <div style={{padding:'0 8px 6px',flexShrink:0}}>
          <div style={{background:pal.primaryContainer,borderRadius:16,padding:'12px 12px 14px',position:'relative',overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.3)'}}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:44,height:44,borderRadius:8,background:pal.surface+'88',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill={pal.onPrimaryContainer}><polygon points="5,3 19,12 5,21"/></svg>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimaryContainer,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{currentTrack.title}</div>
                <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onPrimaryContainer,opacity:0.7}}>{currentTrack.channel}</div>
              </div>
              <button onClick={()=>setPlaying(p=>!p)} style={{width:44,height:44,borderRadius:22,background:'transparent',border:'none',cursor:'pointer',color:pal.onPrimaryContainer,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {playing?<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>:<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>}
              </button>
            </div>
            <div style={{position:'absolute',bottom:0,left:0,right:0,height:3,background:pal.onPrimaryContainer+'30'}}>
              <div style={{height:'100%',width:`${progress*100}%`,background:pal.onPrimaryContainer,transition:'width 1s linear'}}/>
            </div>
          </div>
        </div>
      )}
      <NavBar active={subscreen?'library':tab} onChange={t=>{setTab(t);setSubscreen(null);}} pal={pal}/>
      {sheet&&<ShareSheet pal={pal} mode={sheet} onClose={()=>setSheet(null)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
