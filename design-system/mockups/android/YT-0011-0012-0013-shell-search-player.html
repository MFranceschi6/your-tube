<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT-0011/12/13 — Android Shell, Search, Now Playing (M3)</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-family:'Roboto',sans-serif;}
.phone{width:393px;height:852px;background:#0F0F12;border-radius:44px;box-shadow:0 0 0 2px #3a3a3a,0 40px 100px rgba(0,0,0,0.9),inset 0 0 0 1px #555;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.task-badge{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(103,80,164,0.95);color:white;font-size:11px;font-weight:500;padding:4px 12px;border-radius:999px;z-index:1000;letter-spacing:0.03em;pointer-events:none;box-shadow:0 2px 8px rgba(103,80,164,0.5);}
::-webkit-scrollbar{width:0;}
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
</style>
</head>
<body>
<div class="task-badge">YT-0011 · YT-0012 · YT-0013 — Android (Material 3 + Dynamic Color)</div>
<div class="phone" id="root"></div>
<script type="text/babel">

// ─── Material 3 Dynamic Color palette ───────────────────────────────────────
// In production: derived from user wallpaper via Material You on Android 12+.
// Fallback brand purple shown here. The mockup includes a "wallpaper picker"
// to demonstrate how dynamic color changes the UI accent.
const PALETTES = {
  purple: { primary:'#D0BCFF', onPrimary:'#381E72', primaryContainer:'#4F378B', onPrimaryContainer:'#EADDFF', surface:'#1C1B1F', surfaceVariant:'#49454F', bg:'#141218', onSurface:'#E6E1E5', onSurfaceVariant:'#CAC4D0', outline:'#938F99', name:'Purple (brand default)' },
  blue:   { primary:'#A8C7FA', onPrimary:'#0A305F', primaryContainer:'#28548C', onPrimaryContainer:'#D3E4FF', surface:'#1A1C1E', surfaceVariant:'#43474E', bg:'#111318', onSurface:'#E2E2E9', onSurfaceVariant:'#C3C7CF', outline:'#8D9199', name:'Blue (Material You example)' },
  green:  { primary:'#87EFAC', onPrimary:'#003920', primaryContainer:'#1A5235', onPrimaryContainer:'#A3F4C5', surface:'#191C1A', surfaceVariant:'#3F4944', bg:'#111411', onSurface:'#E1E3DF', onSurfaceVariant:'#BFC9C1', outline:'#899389', name:'Green (Material You example)' },
};

const TRACKS = [
  {videoId:'1',title:'lofi hip hop radio – beats to relax/study to',channel:'Lofi Girl',durationSec:0},
  {videoId:'2',title:'Chill Lofi Mix – Deep Focus',channel:'ChillHop Music',durationSec:3612},
  {videoId:'3',title:'Jazz & Bossa Nova – Morning Coffee',channel:'Café Music BGM',durationSec:3847},
  {videoId:'4',title:'Peaceful Piano Relaxing Music',channel:'Soothing Relaxation',durationSec:7204},
  {videoId:'5',title:'Lo-Fi Beats Vol. 3 – Rain Sounds',channel:'Lofi Records',durationSec:5400},
  {videoId:'6',title:'Bohemian Rhapsody',channel:'Queen',durationSec:355},
  {videoId:'7',title:'Stairway to Heaven',channel:'Led Zeppelin',durationSec:482},
];
const QUEUE=[
  {videoId:'q1',title:'Hotel California',channel:'Eagles',durationSec:438},
  {videoId:'q2',title:'Comfortably Numb',channel:'Pink Floyd',durationSec:382},
];
const fmt=s=>{if(!s)return'Live';const m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`;};

// ─── Android Status Bar ───────────────────────────────────────────────────────
const StatusBar = ({pal}) => (
  <div style={{height:28,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 16px',background:'transparent',zIndex:20}}>
    <span style={{fontFamily:'Roboto',fontSize:12,fontWeight:500,color:pal.onSurface,letterSpacing:0.4}}>9:41</span>
    <div style={{display:'flex',alignItems:'center',gap:4,color:pal.onSurface}}>
      <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" opacity="0.7"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4C10.8 2.4 13.3 3.6 15 5.5L16 4.4C14 2.2 11.2 0.8 8 0.8C4.8 0.8 2 2.2 0 4.4L1 5.5C2.7 3.6 5.2 2.4 8 2.4Z" opacity="0.4"/><path d="M8 5.6C9.8 5.6 11.4 6.4 12.5 7.6L13.5 6.5C12.1 5 10.2 4 8 4C5.8 4 3.9 5 2.5 6.5L3.5 7.6C4.6 6.4 6.2 5.6 8 5.6Z" opacity="0.7"/><circle cx="8" cy="11" r="1.5"/></svg>
      <svg width="22" height="11" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" strokeOpacity="0.5"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor"/></svg>
    </div>
  </div>
);

// ─── M3 Navigation Bar ────────────────────────────────────────────────────────
const NavBar = ({active, onChange, pal}) => {
  const tabs=[
    {id:'search',label:'Search',icon:(a)=>(
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {a && <circle cx="11" cy="11" r="8" fill="currentColor" fillOpacity="0.2" stroke="none"/>}
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    )},
    {id:'library',label:'Library',icon:(a)=>(
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {a && <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" fill="currentColor" fillOpacity="0.15" stroke="none"/>}
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
      </svg>
    )},
    {id:'settings',label:'Settings',icon:(a)=>(
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3" fill={a ? "currentColor" : "none"} fillOpacity="0.3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    )},
  ];
  return (
    <div style={{height:80,flexShrink:0,background:pal.surface,display:'flex',alignItems:'flex-start',paddingTop:12,zIndex:10}}>
      {tabs.map(t=>{
        const on=active===t.id;
        return (
          <button key={t.id} onClick={()=>onChange(t.id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,background:'transparent',border:'none',cursor:'pointer',color:on?pal.primary:pal.onSurfaceVariant,transition:'color 150ms'}}>
            <div style={{width:64,height:32,borderRadius:16,background:on?pal.primaryContainer+'55':'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'background 200ms'}}>
              {t.icon(on)}
            </div>
            <span style={{fontFamily:'Roboto',fontSize:12,fontWeight:on?500:400,letterSpacing:0.4}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
};

// ─── M3 TrackRow ──────────────────────────────────────────────────────────────
const TrackRow = ({track, playing, onTap, pal}) => (
  <div onClick={onTap} style={{display:'flex',alignItems:'center',gap:16,padding:'8px 16px',cursor:'pointer',minHeight:72,background:playing?pal.primaryContainer+'22':'transparent',transition:'background 150ms'}}
    onMouseEnter={e=>{if(!playing)e.currentTarget.style.background=pal.onSurface+'12';}}
    onMouseLeave={e=>{if(!playing)e.currentTarget.style.background='transparent';}}>
    <div style={{width:56,height:56,borderRadius:4,background:playing?pal.primaryContainer:pal.surfaceVariant+'66',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      {playing?<EqAnim pal={pal}/>:<svg width="20" height="20" viewBox="0 0 24 24" fill={pal.onSurfaceVariant} opacity="0.5"><polygon points="5,3 19,12 5,21"/></svg>}
    </div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:playing?500:400,color:playing?pal.primary:pal.onSurface,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',letterSpacing:0.25}}>{track.title}</div>
      <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,marginTop:2,letterSpacing:0.4,display:'flex',gap:6}}>
        <span>{track.channel}</span>
        {track.durationSec>0&&<><span>·</span><span style={{fontVariantNumeric:'tabular-nums'}}>{fmt(track.durationSec)}</span></>}
      </div>
    </div>
    <button style={{width:40,height:40,borderRadius:20,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={e=>e.stopPropagation()}>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
  </div>
);

const EqAnim = ({pal}) => (
  <div style={{display:'flex',alignItems:'flex-end',gap:2,height:16}}>
    {[0,0.2,0.4].map((d,i)=><div key={i} style={{width:3,background:pal.primary,borderRadius:2,animation:`eq .8s ease-in-out ${d}s infinite alternate`}}/>)}
    <style>{`@keyframes eq{from{height:3px}to{height:16px}}`}</style>
  </div>
);

// ─── M3 MiniPlayer ────────────────────────────────────────────────────────────
const MiniPlayer = ({track, playing, progress, onToggle, onExpand, pal}) => {
  if(!track) return null;
  return (
    <div style={{padding:'0 8px 6px',flexShrink:0}}>
      <div onClick={onExpand} style={{background:pal.primaryContainer,borderRadius:16,padding:'12px 12px 14px',cursor:'pointer',position:'relative',overflow:'hidden',boxShadow:`0 2px 8px rgba(0,0,0,0.3)`}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:44,height:44,borderRadius:8,background:pal.surface+'88',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill={pal.onPrimaryContainer}><polygon points="5,3 19,12 5,21"/></svg>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimaryContainer,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',letterSpacing:0.1}}>{track.title}</div>
            <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onPrimaryContainer,opacity:0.7,letterSpacing:0.4}}>{track.channel}</div>
          </div>
          <div style={{display:'flex',gap:0}} onClick={e=>e.stopPropagation()}>
            <button onClick={onToggle} style={{width:44,height:44,borderRadius:22,background:'transparent',border:'none',cursor:'pointer',color:pal.onPrimaryContainer,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {playing?<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>:<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>}
            </button>
            <button style={{width:44,height:44,borderRadius:22,background:'transparent',border:'none',cursor:'pointer',color:pal.onPrimaryContainer,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
          </div>
        </div>
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:3,background:pal.onPrimaryContainer+'30'}}>
          <div style={{height:'100%',width:`${progress*100}%`,background:pal.onPrimaryContainer,transition:'width 1s linear'}}/>
        </div>
      </div>
    </div>
  );
};

// ─── Search Screen (Android) ──────────────────────────────────────────────────
const SearchScreen = ({currentTrack, onPlay, pal}) => {
  const [q,setQ]=React.useState('');
  const [state,setState]=React.useState('idle');
  const inputRef=React.useRef(null);

  const doSearch=(val)=>{
    if(!val.trim())return;
    setState('loading');
    setTimeout(()=>setState('results'),900);
  };

  return (
    <div style={{flex:1,overflowY:'auto',background:pal.bg}}>
      {/* M3 Search Bar (top) */}
      <div style={{padding:'12px 16px 8px'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,height:56,padding:'0 16px',background:pal.surface,borderRadius:28,boxShadow:'0 1px 3px rgba(0,0,0,0.3)'}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={pal.onSurfaceVariant} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input ref={inputRef} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doSearch(q)} placeholder="Search YouTube" style={{flex:1,background:'none',border:'none',outline:'none',fontFamily:'Roboto',fontSize:16,color:pal.onSurface,letterSpacing:0.15}} />
          {q&&<button onClick={()=>{setQ('');setState('idle');}} style={{background:'none',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',padding:0}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>}
          {q&&<button onClick={()=>doSearch(q)} style={{padding:'0 16px',height:36,background:pal.primary,border:'none',borderRadius:18,fontFamily:'Roboto',fontSize:14,fontWeight:500,color:pal.onPrimary,cursor:'pointer',letterSpacing:0.1}}>Search</button>}
        </div>
      </div>

      {/* Suggestion chips (M3 Filter chips) */}
      {state==='idle'&&(
        <div style={{padding:'8px 16px 0',display:'flex',gap:8,flexWrap:'wrap'}}>
          {['lofi beats','jazz cafe','chill hip hop','classical','indie'].map(s=>(
            <button key={s} onClick={()=>{setQ(s);doSearch(s);}} style={{padding:'6px 16px',background:'transparent',border:`1px solid ${pal.outline}`,borderRadius:8,fontFamily:'Roboto',fontSize:14,color:pal.onSurface,cursor:'pointer',letterSpacing:0.1,transition:'all 150ms'}}
              onMouseEnter={e=>{e.currentTarget.style.background=pal.primaryContainer+'44';}}
              onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>
              {s}
            </button>
          ))}
        </div>
      )}

      {state==='loading'&&(
        <div style={{padding:'8px 0'}}>
          {[0,1,2,3,4].map(i=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:16,padding:'8px 16px',minHeight:72}}>
              <div style={{width:56,height:56,borderRadius:4,background:pal.surfaceVariant,opacity:0.5,animation:'sk 1.4s ease infinite',flexShrink:0}}/>
              <div style={{flex:1,display:'flex',flexDirection:'column',gap:8}}>
                <div style={{height:14,width:'60%',background:pal.surfaceVariant,borderRadius:2,opacity:0.5,animation:'sk 1.4s ease infinite'}}/>
                <div style={{height:12,width:'35%',background:pal.surfaceVariant,borderRadius:2,opacity:0.35,animation:'sk 1.4s ease infinite'}}/>
              </div>
              <style>{`@keyframes sk{0%,100%{opacity:.25}50%{opacity:.6}}`}</style>
            </div>
          ))}
        </div>
      )}

      {state==='results'&&(
        <div style={{paddingTop:8}}>
          {TRACKS.map(t=><TrackRow key={t.videoId} track={t} playing={currentTrack?.videoId===t.videoId} onTap={()=>onPlay(t)} pal={pal}/>)}
        </div>
      )}
    </div>
  );
};

// ─── Now Playing Screen (Android) ────────────────────────────────────────────
const NowPlayingScreen = ({track, playing, progress, onToggle, onClose, onNext, onPrev, pal}) => {
  const [showQueue,setShowQueue]=React.useState(false);
  const elapsed=fmt(Math.floor((track?.durationSec||240)*progress));
  const remaining=fmt((track?.durationSec||240)-Math.floor((track?.durationSec||240)*progress));

  return (
    <div style={{position:'absolute',inset:0,zIndex:40,background:`linear-gradient(175deg, ${pal.primaryContainer}88 0%, ${pal.bg} 40%)`,display:'flex',flexDirection:'column',overflow:'auto'}}>
      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 4px 0',flexShrink:0}}>
        <button onClick={onClose} style={{width:48,height:48,borderRadius:24,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="6,9 12,15 18,9"/></svg>
        </button>
        <div style={{textAlign:'center'}}>
          <div style={{fontFamily:'Roboto',fontSize:12,fontWeight:500,color:pal.onSurfaceVariant,letterSpacing:'0.1em',textTransform:'uppercase'}}>Now Playing</div>
        </div>
        <button style={{width:48,height:48,borderRadius:24,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>

      {/* Artwork */}
      <div style={{padding:'8px 40px 0',flex:1,display:'flex',alignItems:'center'}}>
        <div style={{width:'100%',aspectRatio:'1',borderRadius:16,background:`linear-gradient(135deg, ${pal.primaryContainer} 0%, ${pal.surfaceVariant} 100%)`,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 8px 32px rgba(0,0,0,0.5)`,transform:playing?'scale(1)':'scale(0.9)',transition:'transform 300ms ease',maxHeight:260,overflow:'hidden'}}>
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke={pal.onSurface} strokeWidth="0.8" opacity="0.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>

      {/* Info */}
      <div style={{padding:'20px 24px 24px',display:'flex',flexDirection:'column',gap:16}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:'Roboto',fontSize:22,fontWeight:700,color:pal.onSurface,letterSpacing:-0.5,lineHeight:1.2}}>{track?.title||'Nothing playing'}</div>
            <div style={{fontFamily:'Roboto',fontSize:14,color:pal.onSurfaceVariant,marginTop:4,letterSpacing:0.25}}>{track?.channel||''}</div>
          </div>
          <button style={{width:40,height:40,borderRadius:20,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center',marginTop:2}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
        </div>

        {/* Scrubber */}
        <div>
          <div style={{height:4,background:pal.surfaceVariant,borderRadius:2,cursor:'pointer',position:'relative',marginBottom:6}}>
            <div style={{height:'100%',width:`${progress*100}%`,background:pal.primary,borderRadius:2,position:'relative'}}>
              <div style={{position:'absolute',right:-8,top:-6,width:16,height:16,background:pal.primary,borderRadius:'50%',boxShadow:`0 0 0 4px ${pal.primary}33`}}/>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant,fontVariantNumeric:'tabular-nums'}}>
            <span>{elapsed}</span><span>{fmt(track?.durationSec||240)}</span>
          </div>
        </div>

        {/* Transport */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-evenly'}}>
          <button style={{width:48,height:48,borderRadius:24,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16,3 21,3 21,8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21,16 21,21 16,21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button onClick={onPrev} style={{width:56,height:56,borderRadius:28,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="19,20 9,12 19,4"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          {/* M3 FAB-style play button */}
          <button onClick={onToggle} style={{width:72,height:72,borderRadius:36,background:pal.primary,border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:pal.onPrimary,boxShadow:`0 4px 12px ${pal.primary}55`,transition:'all 150ms'}}
            onMouseEnter={e=>{e.currentTarget.style.opacity='0.9';}}
            onMouseLeave={e=>{e.currentTarget.style.opacity='1';}}>
            {playing?<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>:<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style={{marginLeft:4}}><polygon points="5,3 19,12 5,21"/></svg>}
          </button>
          <button onClick={onNext} style={{width:56,height:56,borderRadius:28,background:'transparent',border:'none',cursor:'pointer',color:pal.onSurface,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
          <button onClick={()=>setShowQueue(q=>!q)} style={{width:48,height:48,borderRadius:24,background:showQueue?pal.primaryContainer:'transparent',border:'none',cursor:'pointer',color:showQueue?pal.primary:pal.onSurfaceVariant,display:'flex',alignItems:'center',justifyContent:'center',transition:'all 150ms'}}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>

        {/* Volume */}
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={pal.onSurfaceVariant} strokeWidth="2" strokeLinecap="round"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/></svg>
          <div style={{flex:1,height:4,background:pal.surfaceVariant,borderRadius:2}}>
            <div style={{height:'100%',width:'60%',background:pal.primary,borderRadius:2}}/>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={pal.onSurfaceVariant} strokeWidth="2" strokeLinecap="round"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>

        {/* Queue */}
        {showQueue&&(
          <div style={{background:pal.surface,borderRadius:12,overflow:'hidden'}}>
            <div style={{padding:'10px 16px',fontFamily:'Roboto',fontSize:12,fontWeight:500,color:pal.onSurfaceVariant,textTransform:'uppercase',letterSpacing:'0.08em'}}>Up Next</div>
            {QUEUE.map((t,i)=>(
              <div key={t.videoId} style={{display:'flex',alignItems:'center',gap:12,padding:'8px 16px',borderTop:`0.5px solid ${pal.outline}33`}}>
                <div style={{width:40,height:40,borderRadius:4,background:pal.surfaceVariant,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill={pal.onSurfaceVariant} opacity="0.5"><polygon points="5,3 19,12 5,21"/></svg>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:'Roboto',fontSize:13,fontWeight:500,color:pal.onSurface,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{t.title}</div>
                  <div style={{fontFamily:'Roboto',fontSize:12,color:pal.onSurfaceVariant}}>{t.channel}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ─── Dynamic Color Picker (demonstrates Material You) ────────────────────────
const ColorPicker = ({current, onChange}) => (
  <div style={{padding:'8px 16px',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
    <span style={{fontFamily:'Roboto',fontSize:11,color:'rgba(255,255,255,0.4)',letterSpacing:'0.08em',textTransform:'uppercase',flexShrink:0}}>Dynamic color:</span>
    {Object.entries(PALETTES).map(([k,p])=>(
      <button key={k} onClick={()=>onChange(k)} title={p.name} style={{width:22,height:22,borderRadius:11,background:p.primary,border:current===k?`2px solid white`:'2px solid transparent',cursor:'pointer',flexShrink:0,transition:'transform 150ms',transform:current===k?'scale(1.2)':'scale(1)'}}/>
    ))}
    <span style={{fontFamily:'Roboto',fontSize:11,color:'rgba(255,255,255,0.4)',letterSpacing:0.2}}>{PALETTES[current].name}</span>
  </div>
);

// ─── App ──────────────────────────────────────────────────────────────────────
const App = () => {
  const [palKey,setPalKey]=React.useState('purple');
  const [tab,setTab]=React.useState('search');
  const [track,setTrack]=React.useState(null);
  const [playing,setPlaying]=React.useState(false);
  const [progress,setProgress]=React.useState(0);
  const [npOpen,setNpOpen]=React.useState(false);
  const timerRef=React.useRef(null);
  const pal=PALETTES[palKey];

  React.useEffect(()=>{
    if(playing){timerRef.current=setInterval(()=>setProgress(p=>Math.min(1,p+1/(track?.durationSec||240))),1000);}
    else clearInterval(timerRef.current);
    return()=>clearInterval(timerRef.current);
  },[playing,track]);

  const play=(t)=>{setTrack(t);setProgress(0);setPlaying(true);};

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:pal.bg,position:'relative'}}>
      <StatusBar pal={pal}/>
      <ColorPicker current={palKey} onChange={setPalKey}/>
      <div style={{flex:1,minHeight:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {tab==='search'&&<SearchScreen currentTrack={track} onPlay={play} pal={pal}/>}
        {tab==='library'&&<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:pal.onSurfaceVariant,fontFamily:'Roboto',fontSize:14}}>Library — see YT-0014/0015 mockup</div>}
        {tab==='settings'&&<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:pal.onSurfaceVariant,fontFamily:'Roboto',fontSize:14}}>Settings — see YT-0017 mockup</div>}
      </div>
      <MiniPlayer track={track} playing={playing} progress={progress} onToggle={()=>setPlaying(p=>!p)} onExpand={()=>setNpOpen(true)} pal={pal}/>
      <NavBar active={tab} onChange={setTab} pal={pal}/>
      {npOpen&&<NowPlayingScreen track={track} playing={playing} progress={progress} onToggle={()=>setPlaying(p=>!p)} onClose={()=>setNpOpen(false)} onNext={()=>{}} onPrev={()=>setProgress(0)} pal={pal}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
